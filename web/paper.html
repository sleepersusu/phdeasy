<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章</title>
<style>
:root{
  --fg:#000;--bg:#fff;--muted:#3f3f3f;--line:#cfcfcf;--soft:#f4f4f4;
  --green:#15803d;--on-green:#fff;--yellow:#facc15;--on-yellow:#000;--red:#b91c1c;--on-red:#fff;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6}
a{color:var(--fg);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header{border-bottom:2px solid var(--fg);padding:10px 0 8px}
h1{font-size:1.35rem;line-height:1.35;margin:0}
/* 標題橫跨整行、字小一點，下面讀文章的空間大（本人 2026-10-27） */
.ptitle{font-size:1.12rem;line-height:1.35;margin:6px 48px 0 0}
.ptitle-zh{font-size:.98rem;color:var(--muted);margin-top:2px;margin-right:48px}
.plinks{display:inline-flex;gap:12px}.plinks a{color:#15803d;font-weight:600;text-decoration:underline;text-underline-offset:3px}
h2{font-size:1.2rem;margin:28px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:1rem;margin:16px 0 6px}
.muted{color:var(--muted)}.small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:8px;border:2px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn-green{background:var(--green);color:var(--on-green)}.btn-yellow{background:var(--yellow);color:var(--on-yellow)}.btn-red{background:var(--red);color:var(--on-red)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid var(--fg)}
.pill.g{background:var(--green);color:#fff;border-color:var(--green)}.pill.y{background:var(--yellow);border-color:#a16207}
/* 左英右中 */
.bi{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bi>div{padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.bi>.en{border-right:1px solid var(--line)}
.bi .lab{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.03em}
.bihead{display:grid;grid-template-columns:1fr 1fr;font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.bihead>div{padding:0 14px}
.field{margin-bottom:12px}
.field>.name{font-weight:700;margin:14px 0 6px}
ul,ol{margin:.2em 0;padding-left:1.25em}
li{margin:.25em 0}
details.src{margin-top:6px}
details.src summary{cursor:pointer;font-size:.85rem;color:var(--muted);min-height:32px;display:flex;align-items:center}
blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--soft);font-size:.88rem}
.loc{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.fig{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.fig img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block;margin-top:8px;cursor:zoom-in}
.fig img.big{cursor:zoom-out}
.empty{padding:14px;border:1px dashed var(--fg);border-radius:8px}
.tbl{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:6px}
.tbl table{border-collapse:collapse;font-size:.85rem;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft)}
.facts{font-size:.9rem;margin:4px 0}
@media (max-width:760px){.bi,.bihead{grid-template-columns:1fr}.bi>.en{border-right:none;border-bottom:1px solid var(--line)}.bihead>div:last-child{display:none}}

/* 簡單一致的樣式（本人 2026-10-26：按鈕和格子不要那麼醜）：淺灰細框、柔和的狀態標籤、主要動作綠色、次要按鈕白底 */
:root{--line:#e3e5e8;--soft:#f6f7f8;--muted:#5b5f66}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #d5d8dc;background:#fff;color:var(--fg);font-weight:600;font-size:.95rem;box-shadow:0 1px 1px rgba(0,0,0,.04);transition:background .15s,border-color .15s}
.btn:hover{filter:none;background:var(--soft);border-color:#c3c7cc}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}.btn-green:hover{background:#116632;border-color:#116632}
.btn-yellow{background:#fde68a;border-color:#f2c94c;color:#3b2f00}.btn-yellow:hover{background:#fcd34d;border-color:#e5b73b}
.btn-red{background:#fff;border-color:#f1b5b5;color:#9f1d1d}.btn-red:hover{background:#fdf2f2}
.btn[aria-pressed="false"]{background:#fff;color:var(--fg);border-color:#d5d8dc}
.btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{padding:1px 9px;border:none;border-radius:999px;background:#eef0f2;color:#2b2f33;font-weight:600;font-size:.8rem}
.pill.g{background:#dcf3e3;color:#14532d}.pill.y{background:#fdf1c7;color:#6b4e00}.pill.r{background:#fde2e2;color:#8a1c1c}.pill.o{background:#fff;box-shadow:inset 0 0 0 1px #d5d8dc}
.card,.item,.kpi,.prof,.fig{border:1px solid var(--line);border-radius:10px;background:#fff}
.card,.item,.prof{padding:14px}
.item.attn{border-left:4px solid #e9b949}.item.bad{border-left:4px solid #e57373}
a.card{display:block;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
a.card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.empty{border:1px dashed #cfd3d8;background:var(--soft);color:var(--muted);border-radius:10px}
input[type=text],input[type=search],input[type=date],select,textarea{font:inherit;min-height:40px;padding:8px 10px;border:1px solid #d5d8dc;border-radius:8px;background:#fff;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details.item>summary::before{content:"›";display:inline-block;width:1em;color:var(--muted);transition:transform .15s}
details.item[open]>summary::before{transform:rotate(90deg)}
header.top{border-bottom:1px solid var(--line)}

/* 位置列（麵包屑）：返回放在最上面 */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);margin:0 0 8px}
.crumbs a{color:var(--muted);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.crumbs .sep{color:#b8bcc2}
.crumbs [aria-current]{color:var(--fg);font-weight:600}

/* 研究發現表格 */
.bline{border:1px solid var(--line);border-left:4px solid #15803d;border-radius:8px;padding:10px 14px;margin:8px 0 10px;background:#fff}
.ftbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ftbl table{border-collapse:collapse;width:100%;min-width:640px}
.ftbl th,.ftbl td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.ftbl th{background:var(--soft);font-size:.85rem;white-space:nowrap}
.ftbl td.num{width:2.5em;color:var(--muted);font-weight:700}
.ftbl td.srccol{width:7em}
.ftbl tr:last-child td{border-bottom:none}
.en-sub{font-size:.85em;color:var(--muted);margin-top:4px}
.ftbl details.src summary{min-height:32px}

/* 圖表逐步解讀：每一步一列，左英右中 */
.steps{margin-top:12px}
.steps .bi{border-radius:0;border-top:none}
.steps .steps-head{border-top:1px solid var(--line);border-radius:8px 8px 0 0;background:var(--soft)}
.steps .step:last-child{border-radius:0 0 8px 8px}
.steps .step>div{padding:8px 14px}

/* 全文閱讀：分頁、螢光筆、筆記、問 AI（學 ieltsgod 的閱讀題） */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 0;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--green)}
.tabtip{font-size:.85rem;color:var(--muted);margin:10px 0 0}
mark.rd-hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.rd-note{border-bottom:2px dashed #15803d;cursor:pointer}
.rd-nmark{color:#15803d;cursor:pointer;font-size:.75em;margin-left:1px}
.rd-pop{position:fixed;z-index:300;display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid #d5d8dc;border-radius:10px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.14);max-width:calc(100vw - 16px)}
.rd-btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:.85rem;font-weight:600;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid #d5d8dc;background:#fff;color:var(--fg);cursor:pointer}
.rd-btn:hover{background:var(--soft)}.rd-btn.primary{background:var(--green);border-color:var(--green);color:#fff}.rd-btn[disabled]{opacity:.45;cursor:not-allowed}
.rd-box{position:fixed;z-index:310;width:min(380px,calc(100vw - 16px));background:#fff;border:1px solid #d5d8dc;border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px}
.rd-ask{width:min(420px,calc(100vw - 16px))}
.rd-bar{display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:move;user-select:none}
.rd-bar b{display:inline-flex;align-items:center;gap:6px;font-size:.9rem}
.rd-x{border:none;background:none;cursor:pointer;min-width:36px;min-height:36px;border-radius:8px}.rd-x:hover{background:var(--soft)}
.rd-box textarea{width:100%;resize:vertical;font-size:.92rem}
.rd-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rd-hint{font-size:.78rem;color:var(--muted)}.rd-err{color:#9f1d1d}
.rd-quote{font-size:.82rem;color:var(--muted);border-left:3px solid #fde68a;padding:2px 8px;max-height:72px;overflow:auto}
.rd-log{max-height:300px;overflow:auto;font-size:.9rem}
.rd-q{font-weight:600;margin-top:8px}.rd-a{margin-top:2px;line-height:1.55}
.rd-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;background:#111;color:#fff;padding:9px 14px;border-radius:10px;font-size:.88rem;max-width:90vw}
/* 全文閱讀：左英右中兩欄，各自捲動（學 ieltsgod 閱讀題） */
#main.wide{max-width:none;padding:0}
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line);min-height:420px}
.pane{overflow:auto;padding:18px 26px 80px;min-width:0}
.pane+.pane{border-left:1px solid var(--line);background:#fcfcfb}
#paneEn{font-family:Georgia,"Times New Roman",serif;font-size:var(--rfs,17px);line-height:1.75}
#paneZh{font-size:calc(var(--rfs,17px) - 1.5px);line-height:1.85}
#main:not(.wide){font-size:calc(var(--rfs,17px) - 1px)}
.fsz{margin-left:auto;display:inline-flex;align-items:center;gap:2px;padding-left:12px}
.fsz button{font-family:Georgia,serif;font-weight:700;min-width:36px;min-height:36px;border:1px solid #d5d8dc;background:#fff;border-radius:8px;cursor:pointer;color:var(--fg)}
.fsz button[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
.gear{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:var(--fg)}
.gear:hover{background:var(--soft)}
header .wrap{position:relative}
.ft .pg{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin:22px 0 6px;border-top:1px dashed var(--line);padding-top:6px}
.ft .para{margin:0 0 1em;border-radius:6px;transition:background .3s}
.ft h2.para{font-size:1.3em;margin:0 0 .6em}.ft h3.para{font-size:1.05em;margin:1.2em 0 .4em}
.ft .para.flash{background:#e8f5ec}
.ft .para.pair{background:#dcf2e3;box-shadow:-6px 0 0 #dcf2e3,-10px 0 0 #15803d;border-radius:2px}
.zhbar{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ptabs{display:none;gap:4px;padding:8px 16px}
.ptabs button{font:inherit;font-weight:600;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid #d5d8dc;background:#fff;cursor:pointer}
.ptabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
@media (max-width:900px){.panes{grid-template-columns:minmax(0,1fr)}.pane+.pane{border-left:0}.ptabs{display:flex}.panes[data-show="en"] #paneZh,.panes[data-show="zh"] #paneEn{display:none}.pane{padding:14px 16px 60px}}
.nlist .item{margin:10px 0}
.nlist .q{font-size:.85rem;color:var(--muted);border-left:3px solid #fde68a;padding-left:8px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="目前位置"></nav>
  <a class="gear" href="settings.html#ai" aria-label="設定與 AI 小幫手" title="設定與 AI 小幫手"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  <h1 id="t-en" lang="en" class="ptitle"></h1><div id="t-zh" class="ptitle-zh"></div>
  <div class="row small muted" style="margin-top:4px;gap:4px 12px"><span id="meta"></span><span id="links" class="plinks"></span></div>
</div></header>
<div class="wrap"><div class="tabs" role="tablist" id="tabs" hidden></div><p class="tabtip" id="tabtip" hidden>選取任何一段文字，可以畫螢光筆、寫筆記、問 AI、翻成中文、收藏到計畫書素材。</p></div>
<main class="wrap" id="main"><div class="empty" style="margin-top:16px">載入中…</div></main>
<script src="icons.js"></script><script src="reader.js"></script><script src="ai.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const Q = new URLSearchParams(location.search), SLUG = Q.get("p"), ID = Q.get("id");
const ROLE = {first: "第一作者", middle: "中間作者", last: "最後作者"};
const none = `<span class="muted">來源未提及</span>`;
const noneEn = `<span class="muted" lang="en">Not reported in the source</span>`;

const cites = cs => (cs && cs.length) ? `<details class="src"><summary>原文出處（${cs.length}）</summary>${cs.map(c => `<blockquote lang="en">"${esc(c.quote)}" <span class="loc">[${esc(c.loc)}]</span></blockquote>`).join("")}</details>` : "";
// 每段文字給一個固定的 key（螢光筆、筆記記在這個 key 上）；沒給 key 的就是一般文字
const T = (key, text) => key ? Reader.hl(key, text, "AI 解析") : esc(text);
const pair = (en, zh, labEn, labZh, extra = "", key) => `<div class="bi"><div class="en" lang="en">${labEn ? `<div class="lab">${labEn}</div>` : ""}${en ? T(key && key + ":en", en) : noneEn}</div><div>${labZh ? `<div class="lab">${labZh}</div>` : ""}${zh ? T(key && key + ":zh", zh) : none}${extra}</div></div>`;
const pairList = (items, ordered, key) => {
  if (!items || !items.length) return pair(null, null);
  const tag = ordered ? "ol" : "ul";
  return `<div class="bi"><div class="en" lang="en"><${tag}>${items.map((x, i) => `<li>${x.en ? T(key && `${key}:${i}:en`, x.en) : noneEn}${cites(x.citations)}</li>`).join("")}</${tag}></div><div><${tag}>${items.map((x, i) => `<li>${x.zh ? T(key && `${key}:${i}:zh`, x.zh) : none}</li>`).join("")}</${tag}></div></div>`;
};

function render(d, w, quiet){
  LAST = [d, w];
  document.title = w.title;
  const lib = w.library;  // 討論文獻：教授給的，不是她的文章
  const prof = `professor.html?p=${encodeURIComponent(SLUG)}`;
  $("#crumbs").innerHTML = `<a href="professors.html">← 申請目標</a><span class="sep">›</span><a href="${prof}">${esc(d.professor.name)}</a><span class="sep">›</span>` +
    `<a href="${prof}&v=${lib ? "library" : "papers"}">${lib ? "Meeting" : "文章解析"}</a><span class="sep">›</span><span aria-current="page">這一篇</span>`;
  $("#t-en").textContent = w.title; $("#t-zh").textContent = w.title_zh || (lib ? "" : "（還沒有中文標題）");
  $("#meta").innerHTML = (lib ? [w.year, esc(w.venue || ""), (w.authors || []).slice(0, 3).map(a => esc(a.name)).join(", "),
      lib.discussion && `${esc(lib.discussion)} 討論`,
      w.digest ? (w.text_source === "abstract" ? "依摘要整理" : "依全文整理") : "還在處理"]
    : [w.year, esc(w.venue || "期刊來源未提及"), (ROLE[w.target_position] || "作者序不明") + (w.target_corresponding ? "＋通訊作者" : ""),
    w.card && w.card.exists ? (w.text_source === "abstract" ? "依摘要解析" : w.text_source === "none" ? "只有標題" : "依全文解析") : "還沒解析",
    (w.exceptions || []).some(e => e.kind === "preprint_text") ? "全文是預印本版本" : ""]).filter(Boolean).join("｜");
  // 本人 2026-10-27：不用大按鈕，小連結就好
  $("#links").innerHTML = (w.pdf_href ? `<a href="${esc(w.pdf_href)}" target="_blank" rel="noopener">全文 PDF ↗</a>` : `<span>沒有全文檔</span>`) +
    (w.doi ? `<a href="https://doi.org/${esc(w.doi)}" target="_blank" rel="noopener">期刊頁 ↗</a>` : "");

  const F = Object.fromEntries((w.card.fields || []).map(f => [f.key, f]));
  const g = w.digest;
  let h = "";
  // 1. AI 重點（中英）
  h += `<h2>AI 重點整理</h2>`;
  if (g && g.key_points && g.key_points.length){
    h += `<div class="bihead"><div>English</div><div>中文</div></div>` + pairList(g.key_points, true, "kp");
  } else {
    h += `<div class="empty">這篇還沒有 AI 重點整理${w.text_source === "none" ? "（沒有全文也沒有摘要，只有標題）" : "（由「單篇重點」階段產生）"}。下面是解析卡的大意。</div>`;
    if (F.summary) h += `<div style="margin-top:8px">${pair(F.summary.text_en, F.summary.text, "", "", "", "sum")}</div>`;
  }
  // 1b. 研究發現（白話）：一句話結論＋每一項結果（原文數字與白話說明）
  if (g && (g.bottom_line || (g.findings || []).length)){
    // 本人 2026-10-27：做成表格，不要一段一段散開
    const cell = (k, zh, en) => `${zh ? T(k + ":zh", zh) : none}${en ? `<div class="en-sub" lang="en">${T(k + ":en", en)}</div>` : ""}`;
    const src = cs => (cs && cs.length) ? `<details class="src"><summary>${cs.length} 處</summary>${cs.map(c => `<blockquote lang="en">"${esc(c.quote)}" <span class="loc">[${esc(c.loc)}]</span></blockquote>`).join("")}</details>` : `<span class="muted">—</span>`;
    h += `<h2>研究發現（白話）</h2>`;
    if (g.bottom_line) h += `<div class="bline"><span class="small muted">一句話結論</span><div>${cell("bl", g.bottom_line.zh, g.bottom_line.en)}</div></div>`;
    if ((g.findings || []).length) h += `<div class="ftbl"><table><thead><tr><th scope="col">#</th><th scope="col">白話說明</th><th scope="col">原文結果</th><th scope="col">出處</th></tr></thead><tbody>
      ${g.findings.map((f, i) => `<tr><td class="num">${i + 1}</td><td>${cell(`f${i}p`, f.plain_zh, f.plain_en)}</td><td>${cell(`f${i}o`, f.zh, f.en)}</td><td class="srccol">${src(f.citations)}</td></tr>`).join("")}
      </tbody></table></div>`;
  } else if (g){
    h += `<h2>研究發現（白話）</h2><div class="empty">這篇還沒有白話的研究發現（舊的整理沒有這一段）。在教授頁「工作進度」回覆「補研究發現」就會補上。</div>`;
  }
  // 2. 研究方法（詳細）：設計、場域、對象、樣本、介入、變項、測量、分析、限制
  if (g && g.method && g.method.length){
    h += `<h2>研究方法（詳細）</h2>`;
    g.method.forEach((m, i) => {
      h += `<div class="field"><div class="name">${esc(m.label_zh)} <span class="small muted" lang="en">${esc(m.label_en)}</span></div>${m.not_reported ? `<div class="small muted">原文未提及 · Not reported</div>` : pair(m.en, m.zh, "", "", "", `m${i}`) + cites(m.citations)}</div>`;
    });
  }
  // 3. 研究設計（解析卡）
  h += `<h2>${g && g.method && g.method.length ? "設計與樣本摘要" : "研究設計"}</h2>`;
  const facts = F.design && F.design.facts ? Object.entries(F.design.facts).map(([k, v]) => `${esc(k)}：${esc(v)}`).join("｜") : "";
  const sfacts = F.sample && F.sample.facts ? Object.entries(F.sample.facts).map(([k, v]) => `${esc(k)}：${esc(v)}`).join("｜") : "";
  if (g && g.design) h += pair(g.design.en, g.design.zh, "", "", "", "dz") + cites(g.design.citations);
  if (facts || sfacts) h += `<div class="facts">${facts}${facts && sfacts ? "<br>" : ""}${sfacts}</div>`;
  if (F.design && (F.design.text || F.design.text_en)) h += `<div class="field"><div class="name">設計（解析卡）</div>${pair(F.design.text_en, F.design.text, "", "", "", "cd")}${cites(F.design.citations)}</div>`;
  if (F.sample && (F.sample.text || F.sample.text_en)) h += `<div class="field"><div class="name">樣本</div>${pair(F.sample.text_en, F.sample.text, "", "", "", "cs")}${cites(F.sample.citations)}</div>`;
  // 3. 圖與表（一張都不漏）
  const figs = w.figures || [];
  h += `<h2>圖與表（${figs.length}）</h2>`;
  if (!figs.length) h += `<div class="empty">${w.text_source === "pdf" || w.text_source === "xml" ? "全文裡沒有找到圖或表的標題。" : "沒有全文，看不到圖表；有 PDF 的話可以在教授頁的例外紀錄上傳。"}</div>`;
  figs.forEach((f, fi) => {
    h += `<div class="fig"><div class="row" style="justify-content:space-between"><strong>${esc(f.label)}</strong><span class="loc">${esc(f.loc || "")}</span></div>
      <div class="small" lang="en" style="margin-top:4px">${esc(f.caption || "")}</div>
      ${f.en || f.zh ? `<div style="margin-top:8px">${pair(f.en, f.zh, "What it shows", "這張在講什麼", "", `fig${fi}`)}</div>${cites(f.citations)}` : `<div class="small muted" style="margin-top:6px">（還沒有 AI 說明）</div>`}
      ${f.table_html ? `<div class="tbl">${f.table_html}</div>` : ""}
      ${f.image ? `<img loading="lazy" src="${esc(f.image)}" alt="${esc(f.label)}（${esc(f.loc || "原文")}）">` : (f.table_html ? "" : `<div class="small muted" style="margin-top:6px">這張圖沒有拿到圖檔。</div>`)}
      ${(f.detail || []).length ? `<div class="steps"><div class="bi steps-head"><div class="en lab" lang="en">Step by step</div><div class="lab">逐步解讀</div></div>
        ${f.detail.map((st, i) => `<div class="bi step"><div class="en" lang="en"><b>${i + 1}.</b> ${T(`fig${fi}s${i}:en`, st.en)}</div><div><b>${i + 1}.</b> ${T(`fig${fi}s${i}:zh`, st.zh)}</div></div>`).join("")}</div>` : ""}</div>`;
  });
  // 4. 解析卡其他欄位（左英右中）
  if ((w.card.fields || []).length) h += `<h2>完整解析</h2>`;  // 討論文獻沒有解析卡：不放空標題
  const claimField = (key, ordered) => {
    const f = F[key]; if (!f) return "";
    const items = (f.claims || []).map(c => ({en: c.text_en, zh: c.text, citations: c.citations}));
    return `<div class="field"><div class="name">${esc(f.label)}</div>${f.state === "not_applicable" ? `<div class="small muted">短卡不寫這一欄</div>` : pairList(items, ordered, "c:" + key)}</div>`;
  };
  if (F.summary && g) h += `<div class="field"><div class="name">大意</div>${pair(F.summary.text_en, F.summary.text, "", "", "", "sum")}${cites(F.summary.citations)}</div>`;
  h += claimField("gap") + claimField("solves") + claimField("findings", true);
  if (F.limitations){
    const L = F.limitations;
    const a = (L.author_stated || []).map(c => ({en: c.text_en, zh: c.text, citations: c.citations}));
    const i = (L.inferred || []).map(c => ({en: c.text_en, zh: c.text, citations: c.citations}));
    h += `<div class="field"><div class="name">研究限制</div>${L.state === "not_applicable" ? `<div class="small muted">短卡不寫這一欄</div>` :
      `<div class="small"><strong>作者自己寫的</strong></div>${pairList(a, false, "la")}<div class="small" style="margin-top:8px"><strong>解析者推論（標明非作者原話）</strong></div>${pairList(i, false, "li")}`}</div>`;
  }
  if ((w.keywords_en || []).length) h += `<h2>關鍵詞</h2>${pair((w.keywords_en || []).join(", "), (w.keywords_zh || []).join("、"))}`;
  if (w.abstract) h += `<h2>摘要原文</h2><div lang="en" class="small">${T("abs", w.abstract)}</div>`;
  VIEWS.ai = h;
  VIEWS.full = fullHTML(w);
  if (!quiet) showTab(new URLSearchParams(location.search).get("tab") || "ai");
}

// ---------- 分頁：AI 解析／全文閱讀／我的筆記 ----------
const VIEWS = {ai: "", full: ""};
function fullHTML(w){
  const R = Reader.state, B = R.blocks || [];
  if (!R.ok) return `<div class="empty" style="margin-top:16px">${esc(R.err || "要用 phdeasy 應用程式打開，才能看全文與標記。")}</div>`;
  if (!B.length) return `<div class="empty" style="margin-top:16px">這篇沒有轉好的全文${w.pdf_href ? "（可以按上面「開啟全文 PDF」看原檔）" : ""}。</div>`;
  // 左右兩欄（學 ieltsgod 閱讀題）：左邊英文原文，右邊中文；同一段左右對齊、一起捲動
  const lab = b => /^(p\.|abs)/.test(b.page || "") ? (b.page === "abs" ? "摘要" : `第 ${b.page.slice(2)} 頁`) : "";
  const tagOf = b => b.kind === "h1" ? "h2" : /^h/.test(b.kind || "") ? "h3" : "p";
  let en = R.source === "abstract" ? `<div class="empty">這篇沒有免費全文，只有摘要。</div>` : "", zh = "", pg = null;
  const need = B.filter(b => /[A-Za-z]{2}/.test(b.text) && !R.zh[b.key]).length, job = R.zhJob || {};
  B.forEach(b => {
    if (b.page !== pg && lab(b)){ en += `<div class="pg">${lab(b)}</div>`; zh += `<div class="pg">${lab(b)}</div>`; }
    pg = b.page;
    const t = tagOf(b);
    en += `<${t} class="para" data-k="${esc(b.key)}" lang="en">${Reader.hl("t:" + b.key, b.text, b.page)}</${t}>`;
    zh += `<${t} class="para" data-k="${esc(b.key)}">${R.zh[b.key] ? Reader.hl("z:" + b.key, R.zh[b.key], b.page) : /[A-Za-z]{2}/.test(b.text) ? `<span class="muted small">（還沒翻）</span>` : esc(b.text)}</${t}>`;
  });
  const bar = job.status === "running" ? `<div class="zhbar" role="status">AI 翻譯中… ${job.done}/${job.total} 段（可以先讀，翻好的會自動出現）</div>`
    : need ? `<div class="zhbar">${job.status === "error" ? `<span class="rd-err">翻譯沒有完成：${esc(job.error)}</span><br>` : ""}還有 ${need} 段沒翻成中文。<button type="button" class="rd-btn primary" id="zhGo">${icon("translate", 15)} 整篇翻成中文</button><span class="small muted">（用便宜的模型，背景翻，約幾分鐘）</span></div>` : "";
  return `<div class="ptabs" role="tablist" aria-label="手機上切換"><button type="button" data-show="en" aria-selected="true">English</button><button type="button" data-show="zh" aria-selected="false">中文</button></div>
    <div class="panes" data-show="en"><div class="pane ft" id="paneEn">${en}</div><div class="pane ft" id="paneZh">${bar}${zh}</div></div>`;
}
let zhTimer = null;
function wirePanes(){
  const L = $("#paneEn"), Z = $("#paneZh"); if (!L || !Z) return;
  const fit = () => { const top = $(".panes").getBoundingClientRect().top; $(".panes").style.height = Math.max(420, innerHeight - Math.max(top, 0) - 8) + "px"; };
  fit(); addEventListener("resize", fit);
  // 一邊捲動，另一邊跟到同一段
  let lock = null;
  const follow = (from, to) => () => { if (lock && lock !== from) return; lock = from; clearTimeout(follow.t); follow.t = setTimeout(() => lock = null, 150);
    const top = from.getBoundingClientRect().top; const p = [...from.querySelectorAll(".para")].find(x => x.getBoundingClientRect().bottom > top + 8); if (!p) return;
    const q = to.querySelector(`.para[data-k="${CSS.escape(p.dataset.k)}"]`); if (q) to.scrollTop += (q.getBoundingClientRect().top - to.getBoundingClientRect().top) - (p.getBoundingClientRect().top - top); };
  L.addEventListener("scroll", follow(L, Z)); Z.addEventListener("scroll", follow(Z, L));
  // 照 ieltsgod 檢討：在一邊點一段或選取文字，另一邊捲到同一段、對齊到同一個高度，兩邊都標著，直到點別段
  const pair = (e, from, to) => {
    const p = e.target.closest(".para"); if (!p || e.target.closest(".rd-pop,.rd-box")) return;
    const q = to.querySelector(`.para[data-k="${CSS.escape(p.dataset.k)}"]`); if (!q) return;
    document.querySelectorAll(".para.pair").forEach(x => x.classList.remove("pair"));
    p.classList.add("pair"); q.classList.add("pair");
    lock = from; clearTimeout(follow.t); follow.t = setTimeout(() => lock = null, 400);  // 這次捲動是對齊，不要反過來帶動另一邊
    const want = p.getBoundingClientRect().top - from.getBoundingClientRect().top;
    to.scrollTo({top: to.scrollTop + (q.getBoundingClientRect().top - to.getBoundingClientRect().top) - want, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  };
  L.addEventListener("mouseup", e => setTimeout(() => pair(e, L, Z), 0)); Z.addEventListener("mouseup", e => setTimeout(() => pair(e, Z, L), 0));
  document.querySelectorAll(".ptabs [data-show]").forEach(b => b.onclick = () => { $(".panes").dataset.show = b.dataset.show; document.querySelectorAll(".ptabs [data-show]").forEach(x => x.setAttribute("aria-selected", x === b)); });
  const go = $("#zhGo"); if (go) go.onclick = async () => { go.disabled = true; try { await Reader.translateAll(); } catch (e){ Reader.toast((e && e.error) || "沒辦法開始翻譯"); } redrawFull(); };
  clearTimeout(zhTimer);
  if ((Reader.state.zhJob || {}).status === "running") zhTimer = setTimeout(async () => { await Reader.refreshZh().catch(() => {}); if (new URLSearchParams(location.search).get("tab") === "full") redrawFull(); }, 5000);
}
function redrawFull(){  // 翻譯進度更新：重畫右邊，左邊捲到哪不動
  const L = $("#paneEn"), y = L ? L.scrollTop : 0; rebuild(); $("#main").innerHTML = VIEWS.full; wirePanes(); const L2 = $("#paneEn"); if (L2){ L2.scrollTop = y; L2.dispatchEvent(new Event("scroll")); }
}
function notesHTML(){
  const N = Reader.notes();
  if (!N.length) return `<div class="empty" style="margin-top:16px">這篇還沒有筆記。在「AI 解析」或「全文閱讀」選取文字，按「筆記」或問 AI 後「存成筆記」。</div>`;
  return `<div class="nlist">${N.map(n => `<div class="item"><div class="q" lang="en">${esc(n.quote || "")}</div><div>${esc(n.text).replace(/\n/g, "<br>")}</div>
    <div class="row small muted" style="margin-top:6px">${new Date(n.t).toLocaleString("zh-TW")}${n.key ? `<button type="button" class="rd-btn" data-goto="${esc(n.key)}">${icon("arrow", 14)} 跳到原文</button>` : ""}</div></div>`).join("")}</div>`;
}
function showTab(t){
  if (!["ai", "full", "notes"].includes(t)) t = "ai";
  const n = Reader.notes().length;
  $("#tabs").hidden = false; $("#tabtip").hidden = t === "notes";
  $("#tabs").innerHTML = [["ai", "AI 解析"], ["full", "全文閱讀"], ["notes", `我的筆記${n ? `（${n}）` : ""}`]]
    .map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === t}">${l}</button>`).join("") +
    // 字體大小（照 ieltsgod 閱讀題：三個 A，記住選擇）＋一個更大的
    `<span class="fsz" role="group" aria-label="文章字體大小">${FS.map((v, i) => `<button type="button" data-fs="${v}" aria-pressed="${v === fsGet()}" title="字體 ${v}px" style="font-size:${11 + i * 3}px">A</button>`).join("")}</span>`;
  $("#main").innerHTML = t === "notes" ? notesHTML() : VIEWS[t];
  $("#main").classList.toggle("wide", t === "full");
  if (t === "full") wirePanes();
  document.querySelectorAll(".fig img").forEach(img => img.onclick = () => img.classList.toggle("big"));
  const u = new URL(location.href); if (t === "ai") u.searchParams.delete("tab"); else u.searchParams.set("tab", t); history.replaceState(null, "", u);
}
$("#tabs").addEventListener("click", e => {
  const f = e.target.closest("[data-fs]"); if (f){ fsSet(+f.dataset.fs); return; }
  const b = e.target.closest("[data-tab]"); if (b){ rebuild(); showTab(b.dataset.tab); } });
// 文章字體大小：全文閱讀與 AI 解析都跟著變；存在這台瀏覽器
const FS = [15, 17, 20, 23];
const fsGet = () => { try { const v = +localStorage.getItem("phd.readFs"); return FS.includes(v) ? v : 17; } catch (e) { return 17; } };
function fsSet(v){ try { localStorage.setItem("phd.readFs", v); } catch (e) {} applyFs(); }
function applyFs(){ const v = fsGet(); document.documentElement.style.setProperty("--rfs", v + "px");
  document.querySelectorAll("[data-fs]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.fs === v)); }
applyFs();
$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-goto]"); if (!b) return;
  const k = b.dataset.goto; rebuild(); showTab(k.startsWith("t:") ? "full" : "ai");
  const el = document.querySelector(`[data-hlk="${CSS.escape(k)}"]`); if (el){ el.scrollIntoView({block: "center"}); el.style.outline = "3px solid #15803d"; setTimeout(() => el.style.outline = "", 1600); }
});
let LAST = null;
function rebuild(){ if (LAST) render(LAST[0], LAST[1], true); }  // 切分頁時用最新的標記重畫

(async function init(){
  try {
    if (!SLUG || !ID) throw new Error("網址少了 ?p=<教授>&id=<文章>");
    const base = new URL(`../runs/${encodeURIComponent(SLUG)}/out/site/`, location.href);
    const r = await fetch(new URL("data.json", base), {cache: "no-store"});
    if (!r.ok) throw new Error(`讀不到資料（${r.status}）`);
    const d = await r.json();
    const LIB = new URLSearchParams(location.search).get("lib") === "1";  // 討論文獻（教授給的文獻）
    const w = (LIB ? d.library || [] : d.works).find(x => x.id === ID);
    if (!w) throw new Error(LIB ? `Meeting 文獻裡沒有 ${ID} 這篇` : `這位教授沒有 ${ID} 這篇`);
    const fix = h => h && !/^(https?:|#|mailto:)/.test(h) ? new URL(h, base).href : h;
    w.pdf_href = fix(w.pdf_href);
    (w.figures || []).forEach(f => { f.image = fix(f.image); });
    await Reader.load({slug: SLUG, id: ID, lib: LIB, title: w.title});
    Reader.bind($("#main"));
    render(d, w);
  } catch (e) { $("#main").innerHTML = `<div class="empty" role="alert" style="margin-top:16px">${esc(e.message)}</div>`; }
})();
</script>
</body>
