<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教授研究檔案</title>
<style>
:root{
  --fg:#000;--bg:#fff;--muted:#3f3f3f;--line:#cfcfcf;--soft:#f4f4f4;
  --green:#15803d;--on-green:#fff;--yellow:#facc15;--on-yellow:#000;--red:#b91c1c;--on-red:#fff;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6}
a{color:var(--fg);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{border-bottom:2px solid var(--fg);padding:20px 0 12px}
header.top h1{margin:0;font-size:1.6rem;line-height:1.3}
header.top .meta{color:var(--muted);font-size:.95rem;margin-top:4px}
nav.sections{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.sections .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:6px}
nav.sections a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;text-decoration:none;white-space:nowrap;border-radius:6px;font-weight:600}
nav.sections a:hover,nav.sections a[aria-current="true"]{background:var(--soft);text-decoration:underline}
section{padding:28px 0 8px;border-bottom:1px solid var(--line)}
section h2{font-size:1.3rem;margin:0 0 12px}
h3{font-size:1.05rem;margin:20px 0 8px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi .n{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--muted);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:8px;border:2px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(.92)}
.btn-green{background:var(--green);color:var(--on-green)}
.btn-yellow{background:var(--yellow);color:var(--on-yellow)}
.btn-red{background:var(--red);color:var(--on-red)}
.btn[aria-pressed="false"]{background:var(--bg);color:var(--fg);border-color:currentColor}
.btn-green[aria-pressed="false"]{border-color:var(--green)}
.btn-yellow[aria-pressed="false"]{border-color:#a16207}
.btn-red[aria-pressed="false"]{border-color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;white-space:nowrap;border:1px solid var(--fg)}
.pill.g{background:var(--green);color:var(--on-green);border-color:var(--green)}
.pill.y{background:var(--yellow);color:var(--on-yellow);border-color:#a16207}
.pill.r{background:var(--red);color:var(--on-red);border-color:var(--red)}
.pill.o{background:var(--bg);color:var(--fg)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:700;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 3ch;gap:8px;align-items:center;margin:4px 0}
.bar .track{height:14px;background:var(--soft);border:1px solid var(--line);border-radius:3px}
.bar .fill{height:100%;background:var(--fg)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.item{border:1px solid var(--line);border-radius:8px;padding:12px}
.item.attn{border-left:6px solid #a16207}
.item.bad{border-left:6px solid var(--red)}
details.paper{border:1px solid var(--line);border-radius:8px;margin:10px 0;min-width:0;overflow-wrap:anywhere}
details.paper>summary{list-style:none;cursor:pointer;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:44px}
details.paper>summary::-webkit-details-marker{display:none}
details.paper>summary .t{font-weight:700;font-size:1.02rem}
details.paper>summary .t::before{content:"▸ ";}
details.paper[open]>summary .t::before{content:"▾ ";}
details.paper .inner{padding:0 12px 14px;border-top:1px solid var(--line)}
dl.card{display:grid;grid-template-columns:8em minmax(0,1fr);gap:0;margin:12px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
dl.card dt,dl.card dd{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
dl.card dt{background:var(--soft);font-weight:700}
dl.card dt:last-of-type,dl.card dd:last-of-type{border-bottom:none}
blockquote{overflow-wrap:anywhere;margin:6px 0;padding:4px 10px;border-left:3px solid var(--fg);font-size:.92rem}
blockquote .loc{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.empty{padding:16px;border:1px dashed var(--fg);border-radius:8px}
input[type=search],select{font:inherit;min-height:40px;padding:0 10px;border:1px solid #d5d8dc;border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=search]{flex:1 1 260px}
label.fl{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{padding:24px 0 48px;color:var(--muted);font-size:.9rem}
body.lang-zh .t-en,body.lang-en .t-zh{display:none}
body.lang-both .t-en{display:block;color:var(--muted);font-size:.93em;margin-top:2px}
body.lang-both span.t-en{display:inline}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.langs{display:flex;gap:6px}
.match-form{display:grid;gap:12px;max-width:820px}
.match-form label{font-weight:700}
.match-form textarea,.match-form input[type=text]{font:inherit;width:100%;padding:8px 10px;border:1px solid #d5d8dc;border-radius:8px;background:var(--bg);color:var(--fg)}
.match-form fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 16px}
.match-form fieldset label{font-weight:400;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.match-form input[type=checkbox]{width:20px;height:20px}
.hint{color:var(--muted);font-size:.9rem;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.score{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:3px;width:120px;display:inline-block;vertical-align:middle}
.score>span{display:block;height:100%;background:var(--fg)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.mgrid>div{min-width:0}
@media (max-width:640px){
  dl.card{grid-template-columns:1fr}
  dl.card dt{border-bottom:none;padding-bottom:2px}
  .bar{grid-template-columns:1fr 3ch}
  .bar .name{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* 簡單一致的樣式（本人 2026-10-26：按鈕和格子不要那麼醜）：淺灰細框、柔和的狀態標籤、主要動作綠色、次要按鈕白底 */
:root{--line:#e3e5e8;--soft:#f6f7f8;--muted:#5b5f66}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #d5d8dc;background:#fff;color:var(--fg);font-weight:600;font-size:.95rem;box-shadow:0 1px 1px rgba(0,0,0,.04);transition:background .15s,border-color .15s}
.btn:hover{filter:none;background:var(--soft);border-color:#c3c7cc}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}.btn-green:hover{background:#116632;border-color:#116632}
.btn-yellow{background:#fde68a;border-color:#f2c94c;color:#3b2f00}.btn-yellow:hover{background:#fcd34d;border-color:#e5b73b}
.btn-red{background:#fff;border-color:#f1b5b5;color:#9f1d1d}.btn-red:hover{background:#fdf2f2}
.btn[aria-pressed="false"]{background:#fff;color:var(--fg);border-color:#d5d8dc}
.btn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{padding:1px 9px;border:none;border-radius:999px;background:#eef0f2;color:#2b2f33;font-weight:600;font-size:.8rem}
.pill.g{background:#dcf3e3;color:#14532d}.pill.y{background:#fdf1c7;color:#6b4e00}.pill.r{background:#fde2e2;color:#8a1c1c}.pill.o{background:#fff;box-shadow:inset 0 0 0 1px #d5d8dc}
.card,.item,.kpi,.prof,.fig{border:1px solid var(--line);border-radius:10px;background:#fff}
.card,.item,.prof{padding:14px}
.item.attn{border-left:4px solid #e9b949}.item.bad{border-left:4px solid #e57373}
a.card{display:block;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
a.card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.empty{border:1px dashed #cfd3d8;background:var(--soft);color:var(--muted);border-radius:10px}
input[type=text],input[type=search],input[type=date],select,textarea{font:inherit;min-height:40px;padding:8px 10px;border:1px solid #d5d8dc;border-radius:8px;background:#fff;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details.item>summary::before{content:"›";display:inline-block;width:1em;color:var(--muted);transition:transform .15s}
details.item[open]>summary::before{transform:rotate(90deg)}
header.top{border-bottom:1px solid var(--line)}
nav.sections a{font-weight:500;color:var(--muted)}nav.sections a:hover{background:var(--soft);text-decoration:none;color:var(--fg)}
nav.sections a[aria-current="true"]{background:#eaf5ee;color:#14532d;font-weight:600;text-decoration:none}

/* 語言：右上角一個圖示，點開選中文／English／雙語對照 */
header.top .wrap{flex-wrap:nowrap;align-items:flex-start}
header.top .wrap>div:first-child{flex:1;min-width:0}
.langmenu{position:relative;align-self:flex-start;flex:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;border:1px solid #d5d8dc;background:#fff;color:var(--fg);cursor:pointer}
.iconbtn:hover,.iconbtn[aria-expanded="true"]{background:var(--soft)}
.langmenu .menu{position:absolute;right:0;top:46px;z-index:30;min-width:150px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.langmenu .menu button{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:6px;background:none;font:inherit;color:var(--fg);text-align:left;cursor:pointer}
.langmenu .menu button:hover{background:var(--soft)}
.langmenu .menu button::before{content:"";display:inline-block;width:1em}
.langmenu .menu button[aria-checked="true"]{font-weight:600;color:#14532d}
.langmenu .menu button[aria-checked="true"]::before{content:"✓"}

/* 位置列（麵包屑）：返回放在最上面 */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);margin:0 0 8px}
.crumbs a{color:var(--muted);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.crumbs a:hover{color:var(--fg);text-decoration:underline}
.crumbs .sep{color:#b8bcc2}
.crumbs [aria-current]{color:var(--fg);font-weight:600}

/* 計畫書內文：段落、小標、圖、表 */
.doc-sec .doc-p{margin:0 0 12px}
.doc-sec .doc-h2{font-size:1.02rem;margin:18px 0 8px}
.doc-sec .doc-h3{font-size:.96rem;margin:14px 0 6px;color:var(--muted)}
.doc-fig,.doc-tbl{margin:14px 0}
.doc-fig img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.doc-fig figcaption,.doc-tbl figcaption{margin:6px 0;color:var(--muted)}
.doc-tbl td,.doc-tbl th{font-size:.86rem;overflow-wrap:normal;word-break:normal;hyphens:auto;min-width:7em}
.doc-tbl .lr>div{overflow-wrap:normal}
.doc-refs{padding-left:1.4em}

/* 左英右中（計畫書一律並排；窄螢幕上下排） */
.lr{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.lr>div{min-width:0;overflow-wrap:anywhere}
.lr>.zh{border-left:1px solid var(--line);padding-left:20px}
@media (max-width:760px){.lr{grid-template-columns:1fr}.lr>.zh{border-left:none;padding-left:0;margin-top:4px}}

/* 比對推薦：每篇一列，下面是對到的興趣標籤 */
.reclist{padding-left:1.4em;margin:6px 0}
.reclist>li{margin:10px 0}
</style>
</head>
<body>
<a class="sr" href="#papers">跳到文章解析</a>
<header class="top"><div class="wrap"><div><nav class="crumbs" id="crumbs" aria-label="目前位置"></nav><h1 id="title"></h1><div class="meta" id="meta"></div></div>
  <div class="langmenu">
    <button type="button" class="iconbtn" id="lang-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-menu" aria-label="切換內容語言" title="內容語言">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
    </button>
    <div class="menu" id="lang-menu" role="menu" aria-label="內容語言" hidden>
      <button type="button" role="menuitemradio" data-lang="zh" aria-checked="false">中文</button>
      <button type="button" role="menuitemradio" data-lang="en" aria-checked="false">English</button>
      <button type="button" role="menuitemradio" data-lang="both" aria-checked="true">雙語對照</button>
    </div>
  </div></div></header>
<nav class="sections" aria-label="區段"><div class="wrap"><a href="#match">與我的研究比對</a><a href="#overview">總覽</a><a href="#profile">教授總覽</a><a href="#decisions">待你決定</a><a href="#coauthors">合作者</a><a href="#topics">研究領域</a><a href="#grants">研究計畫</a><a href="#papers">文章解析</a><a href="#exceptions">例外紀錄</a><a href="#files">檔案</a></div></nav>
<main class="wrap"><section id="proposal" aria-labelledby="h-proposal"><h2 id="h-proposal">研究計畫書</h2><div class="body"></div></section><section id="library" aria-labelledby="h-library"><h2 id="h-library">討論文獻</h2><div class="body"></div></section><section id="match" aria-labelledby="h-match"><h2 id="h-match">與我的研究比對</h2><div class="body"></div></section><section id="overview" aria-labelledby="h-overview"><h2 id="h-overview">總覽</h2><div class="body"></div></section><section id="profile" aria-labelledby="h-profile"><h2 id="h-profile">教授總覽</h2><div class="body"></div></section><section id="decisions" aria-labelledby="h-decisions"><h2 id="h-decisions">待你決定</h2><div class="body"></div></section><section id="coauthors" aria-labelledby="h-coauthors"><h2 id="h-coauthors">合作者</h2><div class="body"></div></section><section id="topics" aria-labelledby="h-topics"><h2 id="h-topics">研究領域</h2><div class="body"></div></section><section id="grants" aria-labelledby="h-grants"><h2 id="h-grants">研究計畫</h2><div class="body"></div></section><section id="papers" aria-labelledby="h-papers"><h2 id="h-papers">文章解析</h2><div class="body"></div></section><section id="exceptions" aria-labelledby="h-exceptions"><h2 id="h-exceptions">例外紀錄</h2><div class="body"></div></section><section id="files" aria-labelledby="h-files"><h2 id="h-files">檔案</h2><div class="body"></div></section></main>
<footer class="wrap" id="foot"></footer>
<!-- 大意 --><!-- 研究設計 --><!-- 研究樣本 --><!-- 研究缺口 --><!-- 解決什麼 --><!-- 發現 --><!-- 研究限制 -->
<script id="inline-data" type="application/json">__INLINE__</script>
<script src="site_match.js"></script>
<script>
/* 資料：應用程式從 runs/<slug>/out/site/data.json 讀；離線單檔版把資料內嵌在 #inline-data */
let D = null;
const LS = k => "phdeasy:" + (D.professor.author_id || "x") + ":" + k;
const store = { get(k){ try { return JSON.parse(localStorage.getItem(LS(k))); } catch (e) { return null; } },
                set(k, v){ try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch (e) {} } };
// 雙語：zh 與 en 各一段，切換語言時用 CSS 隱藏；缺翻譯時標明
const bi = (zh, en, tag = "span") => {
  const z = zh ? `<${tag} class="t-zh">${esc(zh)}</${tag}>` : `<${tag} class="t-zh muted">（尚無中文）</${tag}>`;
  const e = en ? `<${tag} class="t-en" lang="en">${esc(en)}</${tag}>` : `<${tag} class="t-en muted">(no English translation yet)</${tag}>`;
  return z + (tag === "span" ? " " : "") + e;
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill = (cls, text) => `<span class="pill ${cls}">${esc(text)}</span>`;
const body = id => $(`#${id} .body`);
const ROLE = {first:"第一作者", middle:"中間作者", last:"最後作者"};
const TYPE = {"article":"期刊論文","review":"綜述","preprint":"預印本","conference-abstract":"會議摘要","editorial":"社論","letter":"信件","erratum":"勘誤"};
const role = (p, c) => (ROLE[p] || "作者序不明") + (c ? "＋通訊" : "");

function fulltextPill(w){
  if (w.fulltext === "ok") return pill("g", w.text_source === "xml" ? "✓ 全文（XML）" : "✓ 全文 PDF");
  if (w.fulltext === "no_free_fulltext") return pill("r", "✗ 無免費全文（僅摘要）");
  if (w.fulltext === "not_needed") return pill("o", "短卡：不需全文");
  return pill("y", "? 全文狀態不明");
}
function grantPill(g){
  if (g.status === "confirmed" && (g.target_role === "pi" || g.target_role === "co_pi")) return pill("g", "✓ 本人主持（API 確認）");
  if (g.status === "pending") return pill("y", "? 待確認");
  if (g.status === "acknowledged") return pill("o", "論文致謝提及");
  return pill("o", "合作者主持");
}
function exPill(e){ return e.state === "open" ? pill("r", "✗ 未解決") : e.state === "resolved" ? pill("g", "✓ 已解決") : pill("y", "註記"); }

function header(){
  const p = D.professor;
  $("#title").textContent = `${p.name} 研究檔案`;
  const pos = (D.basic || {}).position;  // ORCID 有職稱就用「職稱｜系所｜學校」，資訊卡就不再重複
  const who = pos ? [pos.title, pos.department, pos.institution].filter(Boolean).join("｜") : (p.institution || "機構未提及");
  $("#meta").innerHTML = `${esc(who)}｜出版年 ${esc(p.years)}｜資料更新 ${esc(D.generated || "")}`;
  $("#foot").innerHTML = `由 phdeasy 流水線產生。數字都由腳本計算；文章解析每個說法都附原文引句與位置（p.N＝PDF 第幾頁，§N＝全文段落，abs＝摘要）。`;
}

function setLang(l){
  document.body.classList.remove("lang-zh", "lang-en", "lang-both");
  document.body.classList.add("lang-" + l);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.lang === l)));
  store.set("lang", l);
}

function initLangMenu(onPick){
  /* 右上角語言圖示：點開選單，選了就關；點外面或按 Esc 也會關 */
  const btn = document.getElementById("lang-btn"), menu = document.getElementById("lang-menu");
  if (!btn || !menu) return;
  const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.onclick = ev => { ev.stopPropagation(); const open = menu.hidden; menu.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    if (open) (menu.querySelector('[aria-checked="true"]') || menu.querySelector("button")).focus(); };
  menu.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { onPick(b.dataset.lang); close(); btn.focus(); });
  document.addEventListener("click", ev => { if (!menu.hidden && !menu.contains(ev.target)) close(); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !menu.hidden){ close(); btn.focus(); } });
}


const EXAMPLE = {goal: "我想研究用 AI 聊天機器人或手機 app 提升中年女性的身體活動與心血管健康知識，特別是少數族群。",
                 tags: "chatbot、physical activity、women、cardiovascular、health disparities", methods: ["pilot-rct", "quasi-experimental"]};

function recommendHTML(){
  /* prof-match 的推薦（核對過出處、推翻過）：以「文章」為單位，每篇只出現一次，標上它對到你的哪些興趣／CV 項目 */
  const r = D.recommend;
  if (!r) return `<div class="item" style="margin-bottom:12px">${pill("y", "還沒比對")} 還沒依你的興趣做推薦；在「目標教授」頁按「依我的興趣比對」，或跟 Claude 說「比對這位教授」。</div>`;
  const W = Object.fromEntries(D.works.map(w => [w.id, w])), G = Object.fromEntries(D.grants.map(g => [g.key, g]));
  const hits = r.targets.filter(t => t.fit !== "none"), miss = r.targets.filter(t => t.fit === "none");
  const byPaper = new Map(), byGrant = new Map();
  hits.forEach(t => {
    t.papers.forEach(x => { const e = byPaper.get(x.id) || {id: x.id, tags: [], why: x.why}; e.tags.push(t); byPaper.set(x.id, e); });
    t.grants.forEach(x => { const e = byGrant.get(x.key) || {key: x.key, tags: [], why: x.why}; e.tags.push(t); byGrant.set(x.key, e); });
  });
  const weight = e => e.tags.reduce((a, t) => a + (t.fit === "strong" ? 2 : 1), 0);
  const tags = e => e.tags.map(t => pill(t.fit === "strong" ? "g" : "y", t.label_zh)).join(" ");
  const title = id => W[id] ? `<a href="#paper-${esc(id)}">${bi(W[id].title_zh, W[id].title)}</a> <span class="small muted">${W[id].year}</span>` : esc(id);
  const row = e => `<li><div>${title(e.id)}</div><div class="row small" style="margin-top:4px;gap:4px">${tags(e)}</div><div class="small muted">${esc(e.why)}</div></li>`;
  const first = r.read_first.slice(0, 5).map(id => byPaper.get(id) || {id, tags: [], why: ""});
  const others = [...byPaper.values()].filter(e => !r.read_first.slice(0, 5).includes(e.id)).sort((a, b) => weight(b) - weight(a));
  const grants = [...byGrant.values()].sort((a, b) => weight(b) - weight(a));
  const nStrong = hits.filter(t => t.fit === "strong").length;
  return `${r.stale ? `<div class="item attn">${pill("y", "比對過期")} 你的研究興趣或 CV 改過了，這份推薦是用舊的內容比的。</div>` : ""}
    <p class="small muted" style="margin-top:0">你的 ${r.targets.length} 個興趣與 CV 項目：強相關 ${nStrong}、部分相關 ${hits.length - nStrong}、沒有相關 ${miss.length}。每篇下面的標籤是它對到你的哪幾項（綠＝強相關、黃＝部分相關）。</p>
    <h3>必讀前五篇</h3><ol class="reclist">${first.map(row).join("")}</ol>
    ${others.length ? `<details class="item"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center"><strong>其他推薦的文章（${others.length} 篇）</strong></summary><ol class="reclist">${others.map(row).join("")}</ol></details>` : ""}
    ${grants.length ? `<details class="item"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center"><strong>相關計畫（${grants.length} 個）</strong></summary><ul class="reclist">${grants.map(e => `<li><div>${G[e.key] ? bi(G[e.key].title_zh || G[e.key].funder_zh, G[e.key].title || G[e.key].funder) : esc(e.key)}</div><div class="row small" style="margin-top:4px;gap:4px">${tags(e)}</div><div class="small muted">${esc(e.why)}</div></li>`).join("")}</ul></details>` : ""}
    ${miss.length ? `<p class="small muted">沒有找到相關研究：${miss.map(t => esc(t.label_zh)).join("、")}</p>` : ""}`;
}

let MIDX = null;

function match(){
  const el = body("match");
  const saved = store.get("match") || D.me_query || {};
  const designs = [...new Set(D.works.map(w => (w.card.fields.find(x => x.key === "design") || {}).facts).filter(Boolean).map(f => f["設計類型"]).filter(Boolean))];

      <form id="mf" class="match-form">
        <div><label for="m-goal">我想做的研究 <span class="hint">（中文或英文都可以；寫族群、介入方式、想看的結果會更準）</span></label>
          <textarea id="m-goal" rows="4"></textarea></div>
        <div><label for="m-tags">感興趣的主題、方法或族群 <span class="hint">（用逗號或頓號分隔）</span></label>
          <input type="text" id="m-tags"></div>
        <fieldset><legend>偏好的研究設計（可複選）</legend>${designs.map((d, i) => `<label><input type="checkbox" id="m-d${i}" value="${esc(d)}">${esc(d)}</label>`).join("")}</fieldset>
        <div class="row">
          <button type="submit" class="btn btn-green">開始比對</button>
          <button type="button" class="btn btn-yellow" id="m-ex">填入範例</button>
          <button type="button" class="btn btn-red" id="m-clear">清除</button>
        </div>
      </form>
      <div id="m-out" aria-live="polite" style="margin-top:16px"></div></details>`;
    $("#m-goal").value = saved.goal || ""; $("#m-tags").value = saved.tags || "";
    el.querySelectorAll("fieldset input").forEach(c => c.checked = (saved.methods || []).includes(c.value.split("（")[1]?.replace("）", "") || c.value));
    $("#mf").onsubmit = ev => { ev.preventDefault(); runMatch(); };
    $("#m-ex").onclick = () => { $("#m-goal").value = EXAMPLE.goal; $("#m-tags").value = EXAMPLE.tags;
      el.querySelectorAll("fieldset input").forEach(c => c.checked = EXAMPLE.methods.some(m => c.value.includes(m))); runMatch(); };
    $("#m-clear").onclick = () => { $("#m-goal").value = ""; $("#m-tags").value = ""; el.querySelectorAll("fieldset input").forEach(c => c.checked = false);
      store.set("match", null); $("#m-out").innerHTML = ""; $("#m-goal").focus(); };
  }
  if (saved.goal || saved.tags) runMatch();
}

function runMatch(){
  const out = $("#m-out");
  const goal = $("#m-goal").value.trim(), tags = $("#m-tags").value.trim();
  const methods = [...document.querySelectorAll("#mf fieldset input:checked")].map(c => c.value);
  store.set("match", {goal, tags, methods: methods.map(m => (m.match(/（(.+)）/) || [])[1] || m)});
  if (!goal && !tags && !methods.length){ out.innerHTML = `<div class="empty">先寫下你想做的研究，或填幾個感興趣的主題，再按「開始比對」。也可以按「填入範例」看看結果長什麼樣子。</div>`; return; }
  MIDX = MIDX || matchDocs();
  const q = [goal, tags.replace(/[、，,;；]/g, " "), ...methods].join(" ");
  const ranked = rankDocs(q, MIDX);
  const papers = ranked.filter(r => r.kind === "paper"), grantsR = ranked.filter(r => r.kind === "grant");
  if (!papers.length && !grantsR.length){ out.innerHTML = `<div class="empty">沒有找到重疊。試試寫得更具體（族群、介入方式、結果變項），或改用英文關鍵詞，例如 chatbot、physical activity、diabetes prevention。</div>`; return; }
  const top = papers.slice(0, 6), max = (top[0] || grantsR[0]).score;
  const W = Object.fromEntries(D.works.map(w => [w.id, w])), G = Object.fromEntries(D.grants.map(g => [g.key, g]));
  const allHit = [...new Set(ranked.slice(0, 10).flatMap(r => r.matched))];
  const show = m => { const d = displayTerms(q, m); return d.length ? d : m; };
  const terms = show(allHit).slice(0, 14);
  const topIds = new Set(top.map(r => r.id));
  const coll = D.coauthors.map(c => ({c, n: c.works.filter(id => topIds.has(id)).length})).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 6);
  const dsel = methods.map(m => { const n = D.works.filter(w => ((w.card.fields.find(x => x.key === "design") || {}).facts || {})["設計類型"] === m).length; return {m, n}; });
  const qs = ((D.profile.find(s => s.key === "questions") || {}).claims || []);
  const qRel = qs.filter(c => (c.refs || []).some(r => topIds.has(r)));
  const bar = s => `<span class="score" aria-hidden="true"><span style="width:${Math.round(s / max * 100)}%"></span></span>`;
  out.innerHTML = `
    <h3>重疊的主題詞</h3><div class="chips">${terms.map(t => `<span class="pill o">${esc(t)}</span>`).join("")}</div>
    <div class="mgrid" style="margin-top:12px">
      <div><h3>最相關的文章（${papers.length} 篇有重疊，列前 ${top.length}）</h3><ol class="list">${top.map(r => { const w = W[r.id]; return `<li class="item">
        <div class="row">${bar(r.score)} <span class="small">${w.year}｜${esc(role(w.target_position, w.target_corresponding))}</span></div>
        <a href="#paper-${w.id}"><strong>${bi(w.title_zh, w.title)}</strong></a>
        <div class="chips small" style="margin-top:6px">命中：${show(r.matched).slice(0, 8).map(t => `<span class="pill o">${esc(t)}</span>`).join("")}</div></li>`; }).join("")}</ol></div>
      <div>
        <h3>相關計畫</h3>${grantsR.length ? `<ul class="list">${grantsR.slice(0, 4).map(r => { const g = G[r.id]; return `<li class="item">${grantPill(g)} ${bar(r.score)}<div><strong>${g.title ? bi(g.title_zh, g.title) : bi(g.funder_zh, g.funder)}</strong></div><div class="small">${esc(g.award_id || "")} ${esc(g.start || "")}–${esc(g.end || "")}</div></li>`; }).join("")}</ul>` : `<div class="empty">沒有重疊的計畫。</div>`}
        <h3>這些文章裡常一起出現的合作者</h3>${coll.length ? `<ul>${coll.map(x => `<li>${esc(x.c.name)}：${x.n} 篇（全部合作 ${x.c.n} 篇）</li>`).join("")}</ul>` : `<div class="empty">沒有。</div>`}
        ${dsel.length ? `<h3>你偏好的研究設計</h3><ul>${dsel.map(x => `<li>${esc(x.m)}：她有 <strong>${x.n}</strong> 篇</li>`).join("")}</ul>` : ""}
      </div>
    </div>
    <h3>可以問教授的問題（與上面文章相關的${qRel.length ? "" : "；沒有直接相關，列出全部"}）</h3>
    <ul>${(qRel.length ? qRel : qs).map(c => `<li>${esc(c.text)}</li>`).join("") || "<li>總覽尚未產生。</li>"}</ul>
    <p class="small muted">分數是主題詞的重疊程度（依罕見程度加權），只用來排序，不代表適配度。點文章標題可以展開完整解析。</p>`;
}

function cardHtml(w){
  const c = w.card;
  const cites = cs => (cs || []).map(x => `<blockquote>"${esc(x.quote)}" <span class="loc">[${esc(w.id)}, ${esc(x.loc)}]</span></blockquote>`).join("");
  const val = f => {
    if (f.state === "pending") return pill("y", "尚未產生");
    if (f.state === "not_in_source") return `<span class="muted">來源未提及</span>`;
    if (f.state === "not_applicable") return `<span class="muted">短卡不適用（會議摘要、社論等）</span>`;
    const head = f.state === "unresolved" ? pill("y", "? 判不出來") + " " : "";
    if (f.key === "limitations"){
      const part = (t, xs, cls) => xs.length ? `<div><strong>${t}</strong> ${cls}<ul>${xs.map(x => `<li>${bi(x.text, x.text_en, "div")}${x.basis ? `<div class="small muted">推論依據：${esc(x.basis)}</div>` : ""}${cites(x.citations)}</li>`).join("")}</ul></div>` : "";
      return head + (part("作者自述", f.author_stated, "") + part("推論", f.inferred, pill("y", "非作者原話")) || `<span class="muted">來源未提及</span>`);
    }
    if (f.claims) return head + (f.claims.length ? `<ol>${f.claims.map(x => `<li>${bi(x.text, x.text_en, "div")}${cites(x.citations)}</li>`).join("")}</ol>` : `<span class="muted">來源未提及</span>`);
    const facts = f.facts && Object.keys(f.facts).length ? `<div class="row small" style="margin-bottom:6px">${Object.entries(f.facts).map(([k, v]) => `<span class="pill o">${esc(k)}：${esc(v)}</span>`).join("")}</div>` : "";
    return head + facts + bi(f.text, f.text_en, "div") + cites(f.citations);
  };
  return `${c.pending_note ? `<p class="small">${pill("y", "注意")} ${esc(c.pending_note)}</p>` : ""}
    <dl class="card">${c.fields.map(f => `<dt>${esc(f.label)}</dt><dd>${val(f)}</dd>`).join("")}</dl>`;
}

let exFilter = "open";
let APP = null;  /* 在應用程式裡打開時是 /api/status 的內容：例外可以按按鈕請 Claude Code 處理 */
const APIX = (path, body, raw) => fetch("/api/" + path, {method: "POST", headers: {"X-Phdeasy-App": "1", "Content-Type": raw ? "application/pdf" : "application/json"},
  body: raw || JSON.stringify(body)}).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; });
const SLUG = new URLSearchParams(location.search).get("p");

function exActions(e){
  if (!APP || e.state !== "open") return "";
  const acts = (APP.exception_actions || {})[e.kind] || [];
  const isPaper = /^W\d+$/.test(e.id);
  const pdfKinds = ["abstract_only", "title_only", "no_source", "no_text", "title_mismatch", "not_main_text", "unreadable", "wrong_file"];
  return `<div class="row">${acts.map(([a, label]) => `<button class="btn ${a === "grant_no" || a === "split_keep" ? "btn-yellow" : "btn-green"}" data-exa="${esc(a)}" data-id="${esc(e.id)}" data-kind="${esc(e.kind)}">${esc(label)}</button>`).join("")}
    ${isPaper && pdfKinds.includes(e.kind) ? `<label class="btn btn-green" style="cursor:pointer">我有 PDF，上傳<input type="file" accept="application/pdf" data-upload="${esc(e.id)}" data-kind="${esc(e.kind)}" hidden></label>` : ""}
    <button class="btn btn-yellow" data-exa="note" data-id="${esc(e.id)}" data-kind="${esc(e.kind)}">其他指示…</button></div>`;
}

async function startException(id, kind, action, note){
  if (APP.running) throw new Error("已經有一個工作在跑，等它跑完再按");
  await APIX("exception", {slug: SLUG, id, kind, action, note: note || ""});
  alert("已請 Claude Code 在背景處理。進度在「建新教授」頁；做完這一頁重新整理就會更新。");
}

function exceptions(){
  const el = body("exceptions");
  const n = s => D.exceptions.filter(e => e.state === s).length;
  const btn = (k, cls, label) => `<button class="btn ${cls}" aria-pressed="${exFilter === k}" data-x="${k}">${label}（${n(k)}）</button>`;
  const list = D.exceptions.filter(e => e.state === exFilter);
  const ops = APP && exFilter === "open";
  el.innerHTML = `<p class="muted">自動段無法完成而被隔離的項目。未解決的例外超過 30% 時流水線會停下來。${ops ? "每一筆可以請 AI 再處理一次，或上傳你自己下載的 PDF。" : (APP ? "" : "在應用程式裡打開這一頁，未解決的例外會有處理按鈕。")}</p>
    <div class="row" role="group" aria-label="例外篩選">${btn("open", "btn-red", "未解決")}${btn("info", "btn-yellow", "註記")}${btn("resolved", "btn-green", "已解決")}</div>
    ${APP && APP.running ? `<div class="card" style="margin-top:8px" role="status">${pill("y", "執行中")} 已經有一個工作在跑：${esc((APP.job || {}).title || "")}。<a href="pipeline.html">看進度</a></div>` : ""}
    <div class="tablebox" style="margin-top:12px"><table><thead><tr><th>狀態</th><th>項目</th><th>階段</th><th>類型</th><th>說明${ops ? "與處理" : ""}</th></tr></thead><tbody>
    ${list.map(e => `<tr><td>${exPill(e)}</td><td>${/^W\d+$/.test(e.id) ? `<a href="#paper-${e.id}">${e.id}</a>` : esc(e.id)}</td><td>${esc(e.stage)}</td><td>${esc(e.kind)}</td><td class="small">${esc(e.detail)}${e.resolved ? `<div class="muted">解決：${esc(e.resolved)}</div>` : ""}${ops ? `<div style="margin-top:8px">${exActions(e)}</div>` : ""}</td></tr>`).join("") || `<tr><td colspan="5">這一類沒有紀錄。</td></tr>`}
    </tbody></table></div>`;
  el.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { exFilter = b.dataset.x; exceptions(); el.querySelector(`[data-x="${exFilter}"]`).focus(); });
  el.querySelectorAll("[data-exa]").forEach(b => b.onclick = async () => {
    let note = "";
    if (b.dataset.exa === "note"){ note = prompt("要 Claude Code 怎麼處理這筆？（例：這篇的正式版在 PubMed Central 有全文，請再找一次）"); if (!note) return; }
    else if (!confirm(`請 Claude Code 處理 ${b.dataset.id}：「${b.textContent}」？`)) return;
    b.disabled = true;
    try { await startException(b.dataset.id, b.dataset.kind, b.dataset.exa, note); APP = await (await fetch("/api/status", {cache: "no-store"})).json(); exceptions(); }
    catch (err) { alert(err.message); b.disabled = false; }
  });
  el.querySelectorAll("[data-upload]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const r = await APIX(`upload/${encodeURIComponent(SLUG)}/${encodeURIComponent(inp.dataset.upload)}`, null, await f.arrayBuffer());
      if (confirm(`已存到 ${r.saved}。要請 Claude Code 用這個檔重做這篇嗎？`)) await startException(inp.dataset.upload, inp.dataset.kind, "retry_fulltext", "本人剛上傳了這篇的 PDF 到 inbox/");
      APP = await (await fetch("/api/status", {cache: "no-store"})).json(); exceptions();
    } catch (err) { alert(err.message); }
  });
}

const lr = (zh, en) => `<div class="lr"><div class="en" lang="en">${en ? esc(en) : '<span class="muted">—</span>'}</div><div class="zh">${zh ? esc(zh) : '<span class="muted">（尚無中文）</span>'}</div></div>`;  // 計畫書一律左英右中
const ME_BASE = () => OFFLINE ? "../../../_me/" : "../runs/_me/";  // 計畫書的圖檔在 runs/_me/proposal/figures/
function docBlock(b){
  /* 計畫書的一個區塊：段落、小標、圖（原始圖檔）、表（真的表格）、參考文獻 */
  if (b.type === "p") return `<div class="doc-p">${lr(b.zh, b.en)}</div>`;
  if (b.type === "h2") return `<h4 class="doc-h2">${lr(b.zh, b.en)}</h4>`;
  if (b.type === "h3") return `<h5 class="doc-h3">${lr(b.zh, b.en)}</h5>`;
  if (b.type === "ref") return `<li class="small" lang="en">${esc(b.en)}</li>`;
  if (b.type === "figure") return `<figure class="doc-fig"><a href="${esc(ME_BASE() + b.src)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(ME_BASE() + b.src)}" alt="${esc(b.caption_en || "圖")}"></a>
      <figcaption class="small">${lr(b.caption_zh, b.caption_en)}</figcaption></figure>`;
  if (b.type === "table"){
    const table = (rows, lang) => `<div class="tablebox"><table ${lang === "en" ? 'lang="en"' : ""}>
      <thead><tr>${rows[0].map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.slice(1).map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    const rz = (b.rows_zh || []).length === b.rows.length ? b.rows_zh : null;
    return `<figure class="doc-tbl"><figcaption class="small">${lr(b.caption_zh, b.caption_en)}</figcaption>
      <div class="lr"><div class="en">${table(b.rows, "en")}</div><div class="zh">${rz ? table(rz, "zh") : '<span class="muted">（尚無中文）</span>'}</div></div></figure>`;
  }
  return "";
}
function docSection(s){
  const blocks = s.blocks || [];
  const refs = blocks.filter(b => b.type === "ref"), rest = blocks.filter(b => b.type !== "ref");
  return rest.map(docBlock).join("") + (refs.length ? `<ol class="doc-refs">${refs.map(r => docBlock({...r, en: r.en.replace(/^\d+\.\s*/, "")})).join("")}</ol>` : "")
    + (!blocks.length && (s.en || s.zh) ? `<div style="white-space:pre-line">${bi(s.zh || "", s.en, "div")}</div>` : "");
}

function jointHTML(p){
  /* 跟教授定案的計畫書：照原檔的分段、圖與表放上去（來源：本人的 Word 檔，只存在本人的雲端硬碟） */
  const doc = p.document || [];
  const secs = doc.length ? doc.map((s, i) => `<details class="item doc-sec" ${s.key === "references" ? "" : "open"}><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center"><strong>${esc(s.heading_zh)}｜<span lang="en">${esc(s.heading_en)}</span></strong></summary>
      <div style="margin-top:8px">${docSection(s)}</div></details>`).join("")
    : `<h3>研究缺口</h3><ol>${(p.gaps || []).map(g => `<li>${bi(g.zh, g.en, "div")}</li>`).join("")}</ol>
       ${(p.studies || []).map(st => `<div class="item"><strong>${bi(st.name_zh, st.name, "div")}</strong><div class="small" style="margin-top:4px">${bi(st.detail_zh, st.detail, "div")}</div></div>`).join("")}`;
  const meta = (p.document_meta || [p.supervisor]).filter(Boolean);
  return `<div class="card"><div class="row">${pill("g", "已定案")}<span class="small muted">出處：${esc(p.document_src || p.src || "研究計畫書")}</span></div>
    <h3 style="margin-top:10px">${lr(p.title_zh, p.title)}</h3><div class="small muted" lang="en">${esc(p.subtitle || "")}</div>
    ${meta.map(m => `<div class="small" lang="en">${esc(m)}</div>`).join("")}
    ${doc.length ? "" : `<div style="margin-top:8px">${bi(p.synopsis_zh, p.synopsis, "div")}</div>`}</div>${secs}`;
}

function versionHTML(v, opt = {}){
  const c = CONF[(v.confidence || {}).level] || ["", "信心 ?"];
  const sec = (h, x) => x ? `<h3>${h}</h3>${para(x)}` : "";
  return `<div class="card"><div class="row">${pill(c[0], c[1])}<strong style="flex:1">${lr((v.direction || {}).zh, (v.direction || {}).en)}</strong></div>
      <div class="small" style="margin-top:6px">${para(v.confidence)}</div></div>
    ${opt.noTitle ? "" : `<h3 style="margin-top:14px">${lr((v.title || {}).zh, (v.title || {}).en)}</h3>`}<div class="small muted" style="margin-top:8px">${lr((v.subtitle || {}).zh, (v.subtitle || {}).en)}</div>
    ${sec("摘要｜Synopsis", v.synopsis)}
    ${sec("1. 研究背景與缺口｜Rationale and Research Gap", v.rationale)}
    ${(v.gaps || []).length ? `<ol>${v.gaps.map(g => `<li>${para(g)}</li>`).join("")}</ol>` : ""}
    ${sec("2. 整體目的與目標｜Overall Aim and Objectives", v.aim)}
    ${(v.objectives || []).length ? `<ol>${v.objectives.map(o => `<li>${para(o)}</li>`).join("")}</ol>` : ""}
    <h3>3. 研究規劃與方法｜Research Programme and Methodology</h3>
    ${(v.studies || []).map((st, i) => `<div class="item"><strong>3.${i + 1}</strong>${lr((st.name || {}).zh, (st.name || {}).en)}
       <div class="small" style="margin-top:6px"><strong>目的</strong>${para(st.aim)}<strong>設計與方法</strong>${para(st.methods)}<strong>分析</strong>${para(st.analysis)}</div></div>`).join("")}
    ${sec("4. 預期貢獻｜Expected Contribution", v.contribution)}
    ${sec("5. 時程｜Timeline", v.timeline)}
    ${sec("6. 資源與經費｜Resources and Funding", v.resources)}${(v.resources || {}).no_fitting_grant ? `<div class="row">${pill("r", "目前期間內沒有對題的經費")}<span class="small muted">經費來源要跟她討論</span></div>` : ""}
    <h3>我做得到的／可能做得到的</h3>
    <div class="mgrid"><div class="item"><div class="row">${pill("g", "已經會、做過")}</div><ul>${((v.fit || {}).can_do || []).map(x => `<li>${para(x)}</li>`).join("")}</ul></div>
      <div class="item"><div class="row">${pill("y", "要再學、可能做得到")}</div><ul>${((v.fit || {}).could_do || []).map(x => `<li>${para(x)}</li>`).join("")}</ul></div></div>
    ${sec("風險與限制｜Risks", v.risks)}`;
}

function proposalView(){
  const el = body("proposal"), p = D.joint_proposal, d = D.proposal_draft, vs = draftVersions(D);
  if (!p && !vs.length){
    el.innerHTML = `<div class="empty">還沒有研究計畫書。${d && !vs.length ? "（之前的草稿是舊格式，請重新產生。）" : ""}${APP ? "" : `在應用程式裡打開可以按按鈕產生；或跟 Claude 說「幫我擬 ${esc(D.professor.name)} 的研究計畫書」。`}${proposeButton(!!d)}</div>`;
    return;
  }
  let html = p ? jointHTML(p) : "";
  if (vs.length){
    const cur = vs.find(v => v.id === PROP_VER) || vs[0];
    html += `<h3 style="margin-top:${p ? "28px" : "0"}">${p ? "AI 草稿：延伸方向" : "AI 草稿"}</h3>
      <div class="item attn">${pill("y", "草稿")} 依 ${esc(D.professor.name)} 的研究方向與目前期間內的經費、你的興趣與做得到的事擬的 ${vs.length} 個方向，<strong>只是素材</strong>，寄給教授前請自己改寫。信心程度看經費是不是她主持、你要補多少能力。${d.stale ? " 你的 CV 或她的資料改過，這份可能過期。" : ""}</div>
      <div class="row" role="tablist" style="margin-top:10px;flex-wrap:wrap">${vs.map(v => { const c = CONF[(v.confidence || {}).level] || ["", "?"];
        return `<button class="btn ${v.id === cur.id ? "btn-green" : ""}" role="tab" aria-selected="${v.id === cur.id}" data-ver="${esc(v.id)}">${esc(v.id)}｜${esc((v.direction || {}).zh || "")} ${pill(c[0], c[1])}</button>`; }).join("")}</div>
      <div style="margin-top:12px">${versionHTML(cur)}</div>`;
  }
  if (vs.length && !p) html += proposeButton(true);  // 跟她討論過的計畫書已定案：不再擬版本
  el.innerHTML = html;
}

/* 討論文獻：教授給的文獻（上傳 PDF、貼 DOI、從 Zotero 選），跟她的文章走同一套處理；勾選幾篇擬初稿 */
const LIBSEL = new Set();
const libPage = id => paperPage(id) + "&lib=1";
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };  // 本地日期
function libAddHTML(){
  /* 在這位教授頁加的文獻就是她給的：只要填哪次討論（日期），再貼 DOI 或從 Zotero 選 */

function libMeta(){ return {given_by: D.professor.name || "", discussion: $("#lb-when").value}; }
async function libAfterAdd(msg){ $("#lb-msg").textContent = msg + " 重新整理就會看到；按「開始處理」讓 AI 整理重點與圖表。"; }

function libraryView(){

document.addEventListener("change", async ev => {

          <span>${esc(it.title || "")} <span class="small muted">${esc(it.authors || "")} ${esc(it.year || "")}${it.doi ? "" : "（沒有 DOI，請改用上傳 PDF）"}</span></span></label>`).join("") +
        `<button class="btn btn-green" data-zadd style="margin-top:6px">加入勾選的</button>`;
    } else if (t.matches("[data-zadd]")){
      const dois = [...document.querySelectorAll("[data-zdoi]:checked")].map(x => x.dataset.zdoi).filter(Boolean);
      if (!dois.length) return;
      $("#lb-msg").textContent = "加入中…";
      await APIX("library-add", {slug: SLUG, dois, source: "zotero", ...libMeta()}); await libAfterAdd(`已從 Zotero 加入 ${dois.length} 篇（PDF 會從 Zotero 附件拿）。`);
    } else if (t.matches("[data-lib-process]")){
      if (APP.running) return alert("已經有一個工作在跑，等它跑完再按");
      await APIX("library-process", {slug: SLUG}); location.href = "pipeline.html";
    } else if (t.matches("[data-lib-draft]")){
      if (!LIBSEL.size) return alert("先勾選要用的文獻");
      if (APP.running) return alert("已經有一個工作在跑，等它跑完再按");
      if (!confirm(`用勾選的 ${LIBSEL.size} 篇與她的文章，照 Liliana 改過的計畫書分段擬一份初稿？`)) return;
      await APIX("library-draft", {slug: SLUG, ids: [...LIBSEL]}); location.href = "pipeline.html";
    }
  } catch (e) { const m = $("#lb-msg"); if (m) m.textContent = "失敗：" + e.message; else alert(e.message); }
});

function openFromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (!OFFLINE && id.startsWith("paper-")){ location.replace(paperPage(id.slice(6))); return; }
  if (id.startsWith("paper-")) openPaper(id.slice(6));
}
function navHighlight(){
  const links = [...document.querySelectorAll("nav.sections a")];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + e.target.id))); }), {rootMargin: "-40% 0px -55% 0px"});
  document.querySelectorAll("main section").forEach(s => io.observe(s));
}

function openPaper(id){
  let d = document.getElementById("paper-" + id);
  if (!d){ PF.q = ""; PF.ft = "all"; PF.year = "all"; $("#pq").value = ""; $("#py").value = "all"; papers(); d = document.getElementById("paper-" + id); }
  if (!d) return;
  d.open = true; d.scrollIntoView({block: "start"}); d.querySelector("summary").focus({preventScroll: true});
  try { history.replaceState(null, "", "#paper-" + id); } catch (e) {}
}
document.addEventListener("click", ev => {
  const a = ev.target.closest('a[href^="#paper-"]');
  if (!a || a.dataset.copy) return;
  ev.preventDefault();
  if (!OFFLINE){ location.href = paperPage(a.getAttribute("href").slice(7)); return; }  // 應用程式：直接開那一篇自己的頁面
  openPaper(a.getAttribute("href").slice(7));
});

function rebase(d, base){
  /* data.json 裡的連結是相對於 runs/<slug>/out/site/ 的，轉成這一頁看得懂的網址 */
  const fix = h => h && !/^(https?:|#|mailto:)/.test(h) ? new URL(h, base).href : h;
  d.works.forEach(w => { w.pdf_href = fix(w.pdf_href); });
  d.files.forEach(f => { f.href = fix(f.href); });
  return d;
}
async function loadData(){
  const inline = document.getElementById("inline-data").textContent.trim();
  if (inline && inline !== "__INLINE__") return JSON.parse(inline);
  const slug = new URLSearchParams(location.search).get("p");
  if (!slug) throw new Error("網址少了 ?p=<教授資料夾>");
  const base = new URL(`../runs/${encodeURIComponent(slug)}/out/site/`, location.href);
  const r = await fetch(new URL("data.json", base), {cache: "no-store"});
  if (!r.ok) throw new Error(`讀不到 ${slug} 的資料（${r.status}）`);
  return rebase(await r.json(), base.href);
}
(async function init(){
  try { D = await loadData(); }
  catch (e) { document.querySelector("main").innerHTML = `<div class="empty" role="alert">${esc(e.message)}</div>`; return; }
  OFFLINE = document.getElementById("inline-data").textContent.trim() !== "__INLINE__";
  if (OFFLINE) HOME_HREF = "../../../index.html";
  document.title = (D.professor.name || "") + " 研究檔案";
  setLang(store.get("lang") || "both");
  initLangMenu(setLang);
  header(); proposalView(); libraryView(); match(); overview(); profile(); decisions(); coauthors(); topics(); grants(); papers(); exceptions(); files();
  if (OFFLINE){ navHighlight(); }   // 離線單檔版：全部放在一頁
  else { setupViews(); }            // 應用程式：教授首頁是按鈕，一個按鈕進一個區塊
  openFromHash();
  window.addEventListener("hashchange", openFromHash);
  try { const r = await fetch("/api/status", {cache: "no-store"}); if (r.ok){ APP = await r.json(); exceptions(); proposalView(); libraryView(); } } catch (e) {}  // 離線單檔版沒有 /api
})();
</script>
