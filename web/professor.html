<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教授研究檔案</title>
<style>
:root{
  --fg:#000;--bg:#fff;--muted:#3f3f3f;--line:#cfcfcf;--soft:#f4f4f4;
  --green:#15803d;--on-green:#fff;--yellow:#facc15;--on-yellow:#000;--red:#b91c1c;--on-red:#fff;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6}
a{color:var(--fg);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{border-bottom:2px solid var(--fg);padding:20px 0 12px}
header.top h1{margin:0;font-size:1.6rem;line-height:1.3}
header.top .meta{color:var(--muted);font-size:.95rem;margin-top:4px}
nav.sections{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.sections .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:6px}
nav.sections a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;text-decoration:none;white-space:nowrap;border-radius:6px;font-weight:600}
nav.sections a:hover,nav.sections a[aria-current="true"]{background:var(--soft);text-decoration:underline}
section{padding:28px 0 8px;border-bottom:1px solid var(--line)}
section h2{font-size:1.3rem;margin:0 0 12px}
h3{font-size:1.05rem;margin:20px 0 8px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi .n{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--muted);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:8px;border:2px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(.92)}
.btn-green{background:var(--green);color:var(--on-green)}
.btn-yellow{background:var(--yellow);color:var(--on-yellow)}
.btn-red{background:var(--red);color:var(--on-red)}
.btn[aria-pressed="false"]{background:var(--bg);color:var(--fg);border-color:currentColor}
.btn-green[aria-pressed="false"]{border-color:var(--green)}
.btn-yellow[aria-pressed="false"]{border-color:#a16207}
.btn-red[aria-pressed="false"]{border-color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;white-space:nowrap;border:1px solid var(--fg)}
.pill.g{background:var(--green);color:var(--on-green);border-color:var(--green)}
.pill.y{background:var(--yellow);color:var(--on-yellow);border-color:#a16207}
.pill.r{background:var(--red);color:var(--on-red);border-color:var(--red)}
.pill.o{background:var(--bg);color:var(--fg)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:700;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 3ch;gap:8px;align-items:center;margin:4px 0}
.bar .track{height:14px;background:var(--soft);border:1px solid var(--line);border-radius:3px}
.bar .fill{height:100%;background:var(--fg)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.item{border:1px solid var(--line);border-radius:8px;padding:12px}
.item.attn{border-left:6px solid #a16207}
.item.bad{border-left:6px solid var(--red)}
details.paper{border:1px solid var(--line);border-radius:8px;margin:10px 0;min-width:0;overflow-wrap:anywhere}
details.paper>summary{list-style:none;cursor:pointer;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:44px}
details.paper>summary::-webkit-details-marker{display:none}
details.paper>summary .t{font-weight:700;font-size:1.02rem}
details.paper>summary .t::before{content:"▸ ";}
details.paper[open]>summary .t::before{content:"▾ ";}
details.paper .inner{padding:0 12px 14px;border-top:1px solid var(--line)}
dl.card{display:grid;grid-template-columns:8em minmax(0,1fr);gap:0;margin:12px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
dl.card dt,dl.card dd{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
dl.card dt{background:var(--soft);font-weight:700}
dl.card dt:last-of-type,dl.card dd:last-of-type{border-bottom:none}
blockquote{overflow-wrap:anywhere;margin:6px 0;padding:4px 10px;border-left:3px solid var(--fg);font-size:.92rem}
blockquote .loc{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.empty{padding:16px;border:1px dashed var(--fg);border-radius:8px}
input[type=search],select{font:inherit;min-height:44px;padding:0 10px;border:2px solid var(--fg);border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=search]{flex:1 1 260px}
label.fl{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{padding:24px 0 48px;color:var(--muted);font-size:.9rem}
body.lang-zh .t-en,body.lang-en .t-zh{display:none}
body.lang-both .t-en{display:block;color:var(--muted);font-size:.93em;margin-top:2px}
body.lang-both span.t-en{display:inline}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.langs{display:flex;gap:6px}
.match-form{display:grid;gap:12px;max-width:820px}
.match-form label{font-weight:700}
.match-form textarea,.match-form input[type=text]{font:inherit;width:100%;padding:10px;border:2px solid var(--fg);border-radius:8px;background:var(--bg);color:var(--fg)}
.match-form fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 16px}
.match-form fieldset label{font-weight:400;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.match-form input[type=checkbox]{width:20px;height:20px}
.hint{color:var(--muted);font-size:.9rem;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.score{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:3px;width:120px;display:inline-block;vertical-align:middle}
.score>span{display:block;height:100%;background:var(--fg)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.mgrid>div{min-width:0}
@media (max-width:640px){
  dl.card{grid-template-columns:1fr}
  dl.card dt{border-bottom:none;padding-bottom:2px}
  .bar{grid-template-columns:1fr 3ch}
  .bar .name{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="sr" href="#papers">跳到文章解析</a>
<header class="top"><div class="wrap"><div><a class="btn btn-green" href="index.html" id="home-link" style="margin-bottom:8px">← 回我的首頁</a><h1 id="title"></h1><div class="meta" id="meta"></div></div>
  <div class="langs" role="group" aria-label="內容語言">
    <button class="btn btn-green" data-lang="zh" aria-pressed="false">中文</button>
    <button class="btn btn-green" data-lang="en" aria-pressed="false">English</button>
    <button class="btn btn-green" data-lang="both" aria-pressed="true">雙語</button>
  </div></div></header>
<nav class="sections" aria-label="區段"><div class="wrap"><a href="#match">與我的研究比對</a><a href="#overview">總覽</a><a href="#profile">教授總覽</a><a href="#decisions">待你決定</a><a href="#coauthors">合作者</a><a href="#topics">研究領域</a><a href="#grants">研究計畫</a><a href="#papers">文章解析</a><a href="#exceptions">例外紀錄</a><a href="#files">檔案</a></div></nav>
<main class="wrap"><section id="proposal" aria-labelledby="h-proposal"><h2 id="h-proposal">研究計畫書</h2><div class="body"></div></section><section id="match" aria-labelledby="h-match"><h2 id="h-match">與我的研究比對</h2><div class="body"></div></section><section id="overview" aria-labelledby="h-overview"><h2 id="h-overview">總覽</h2><div class="body"></div></section><section id="profile" aria-labelledby="h-profile"><h2 id="h-profile">教授總覽</h2><div class="body"></div></section><section id="decisions" aria-labelledby="h-decisions"><h2 id="h-decisions">待你決定</h2><div class="body"></div></section><section id="coauthors" aria-labelledby="h-coauthors"><h2 id="h-coauthors">合作者</h2><div class="body"></div></section><section id="topics" aria-labelledby="h-topics"><h2 id="h-topics">研究領域</h2><div class="body"></div></section><section id="grants" aria-labelledby="h-grants"><h2 id="h-grants">研究計畫</h2><div class="body"></div></section><section id="papers" aria-labelledby="h-papers"><h2 id="h-papers">文章解析</h2><div class="body"></div></section><section id="exceptions" aria-labelledby="h-exceptions"><h2 id="h-exceptions">例外紀錄</h2><div class="body"></div></section><section id="files" aria-labelledby="h-files"><h2 id="h-files">檔案</h2><div class="body"></div></section></main>
<footer class="wrap" id="foot"></footer>
<!-- 大意 --><!-- 研究設計 --><!-- 研究樣本 --><!-- 研究缺口 --><!-- 解決什麼 --><!-- 發現 --><!-- 研究限制 -->
<script id="inline-data" type="application/json">__INLINE__</script>
<script src="site_match.js"></script>
<script>
/* 資料：應用程式從 runs/<slug>/out/site/data.json 讀；離線單檔版把資料內嵌在 #inline-data */
let D = null;
const LS = k => "phdeasy:" + (D.professor.author_id || "x") + ":" + k;
const store = { get(k){ try { return JSON.parse(localStorage.getItem(LS(k))); } catch (e) { return null; } },
                set(k, v){ try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch (e) {} } };
// 雙語：zh 與 en 各一段，切換語言時用 CSS 隱藏；缺翻譯時標明
const bi = (zh, en, tag = "span") => {
  const z = zh ? `<${tag} class="t-zh">${esc(zh)}</${tag}>` : `<${tag} class="t-zh muted">（尚無中文）</${tag}>`;
  const e = en ? `<${tag} class="t-en" lang="en">${esc(en)}</${tag}>` : `<${tag} class="t-en muted">(no English translation yet)</${tag}>`;
  return z + (tag === "span" ? " " : "") + e;
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill = (cls, text) => `<span class="pill ${cls}">${esc(text)}</span>`;
const body = id => $(`#${id} .body`);
const ROLE = {first:"第一作者", middle:"中間作者", last:"最後作者"};
const TYPE = {"article":"期刊論文","review":"綜述","preprint":"預印本","conference-abstract":"會議摘要","editorial":"社論","letter":"信件","erratum":"勘誤"};
const role = (p, c) => (ROLE[p] || "作者序不明") + (c ? "＋通訊" : "");

function fulltextPill(w){
  if (w.fulltext === "ok") return pill("g", w.text_source === "xml" ? "✓ 全文（XML）" : "✓ 全文 PDF");
  if (w.fulltext === "no_free_fulltext") return pill("r", "✗ 無免費全文（僅摘要）");
  if (w.fulltext === "not_needed") return pill("o", "短卡：不需全文");
  return pill("y", "? 全文狀態不明");
}
function grantPill(g){
  if (g.status === "confirmed" && (g.target_role === "pi" || g.target_role === "co_pi")) return pill("g", "✓ 本人主持（API 確認）");
  if (g.status === "pending") return pill("y", "? 待確認");
  if (g.status === "acknowledged") return pill("o", "論文致謝提及");
  return pill("o", "合作者主持");
}
function exPill(e){ return e.state === "open" ? pill("r", "✗ 未解決") : e.state === "resolved" ? pill("g", "✓ 已解決") : pill("y", "註記"); }

function header(){
  const p = D.professor;
  $("#title").textContent = `${p.name} 研究檔案`;
  $("#meta").innerHTML = `${esc(p.institution || "機構未提及")}｜出版年 ${esc(p.years)}｜資料更新 ${esc(D.generated || "")}`;
  $("#foot").innerHTML = `由 phdeasy 流水線產生。數字都由腳本計算；文章解析每個說法都附原文引句與位置（p.N＝PDF 第幾頁，§N＝全文段落，abs＝摘要）。`;
}

function setLang(l){
  document.body.classList.remove("lang-zh", "lang-en", "lang-both");
  document.body.classList.add("lang-" + l);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  store.set("lang", l);
}

const EXAMPLE = {goal: "我想研究用 AI 聊天機器人或手機 app 提升中年女性的身體活動與心血管健康知識，特別是少數族群。",
                 tags: "chatbot、physical activity、women、cardiovascular、health disparities", methods: ["pilot-rct", "quasi-experimental"]};

function recommendHTML(){
  /* prof-match：Claude 依你的興趣與 CV 項目挑出的推薦（核對過出處、推翻過） */
  const r = D.recommend;
  if (!r) return `<div class="item" style="margin-bottom:12px">${pill("y", "還沒比對")} 還沒依你的興趣做推薦；在「目標教授」頁按「依我的興趣比對」，或跟 Claude 說「比對這位教授」。</div>`;
  const W = Object.fromEntries(D.works.map(w => [w.id, w])), G = Object.fromEntries(D.grants.map(g => [g.key, g]));
  const FITL = {strong: ["g", "強相關"], partial: ["y", "部分相關"], none: ["", "沒有相關"]};
  const paper = id => W[id] ? `<a href="#paper-${esc(id)}">${bi(W[id].title_zh, W[id].title)}</a> <span class="small muted">${W[id].year}</span>` : esc(id);
  return `${r.stale ? `<div class="item attn">${pill("y", "比對過期")} 你的研究興趣或研究計畫改過了，這份推薦是用舊的內容比的。</div>` : ""}
    <h3>建議先看這幾篇</h3><ol>${r.read_first.map(id => `<li>${paper(id)}</li>`).join("")}</ol>
    <h3>依你的興趣與 CV 項目</h3>
    ${r.targets.filter(t => t.fit !== "none").map(t => `<details class="item" ${t.fit === "strong" ? "open" : ""}><summary style="cursor:pointer;min-height:44px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(FITL[t.fit][0], FITL[t.fit][1])}<strong>${esc(t.label_zh)}</strong>${t.kind === "cv" ? `<span class="small muted">（你的 CV：會的／做過的）</span>` : ""}</summary>
      <div class="small">${esc(t.why)}</div>
      <ul>${t.papers.map(x => `<li>${paper(x.id)}<div class="small muted">${esc(x.why)}</div></li>`).join("")}
      ${t.grants.map(x => `<li>${G[x.key] ? bi(G[x.key].title_zh || G[x.key].funder_zh, G[x.key].title || G[x.key].funder) : esc(x.key)}<div class="small muted">${esc(x.why)}</div></li>`).join("")}</ul></details>`).join("")}
    ${r.targets.some(t => t.fit === "none") ? `<p class="small muted">沒有找到相關研究：${r.targets.filter(t => t.fit === "none").map(t => esc(t.label_zh)).join("、")}</p>` : ""}`;
}

function matchDocs(){ return buildIndex(D.match_docs); }
let MIDX = null;

function match(){
  const el = body("match");
  const saved = store.get("match") || D.me_query || {};
  const designs = [...new Set(D.works.map(w => (w.card.fields.find(x => x.key === "design") || {}).facts).filter(Boolean).map(f => f["設計類型"]).filter(Boolean))];
  if (!$("#mf")){
    el.innerHTML = recommendHTML() + `<h3>${D.recommend ? "自己輸入想做的研究（用詞比對，參考用）" : ""}</h3>
      ${D.me_query && !store.get("match") ? `<div class="item" style="margin-bottom:12px">${pill("g", "已套用")} 已自動帶入你的 CV 摘要、研究興趣與能力領域，可以直接修改後重新比對。</div>` : ""}
      <p class="muted">輸入你想做的研究，頁面會在你的瀏覽器裡跟這位教授的文章、計畫、合作者與方法比對，列出重疊之處和證據。比對只看主題與用詞的重疊程度，<strong>不是</strong>「適不適合」的判斷；你輸入的內容只存在這台電腦的瀏覽器。</p>
      <form id="mf" class="match-form">
        <div><label for="m-goal">我想做的研究 <span class="hint">（中文或英文都可以；寫族群、介入方式、想看的結果會更準）</span></label>
          <textarea id="m-goal" rows="4"></textarea></div>
        <div><label for="m-tags">感興趣的主題、方法或族群 <span class="hint">（用逗號或頓號分隔）</span></label>
          <input type="text" id="m-tags"></div>
        <fieldset><legend>偏好的研究設計（可複選）</legend>${designs.map((d, i) => `<label><input type="checkbox" id="m-d${i}" value="${esc(d)}">${esc(d)}</label>`).join("")}</fieldset>
        <div class="row">
          <button type="submit" class="btn btn-green">開始比對</button>
          <button type="button" class="btn btn-yellow" id="m-ex">填入範例</button>
          <button type="button" class="btn btn-red" id="m-clear">清除</button>
        </div>
      </form>
      <div id="m-out" aria-live="polite" style="margin-top:16px"></div>`;
    $("#m-goal").value = saved.goal || ""; $("#m-tags").value = saved.tags || "";
    el.querySelectorAll("fieldset input").forEach(c => c.checked = (saved.methods || []).includes(c.value.split("（")[1]?.replace("）", "") || c.value));
    $("#mf").onsubmit = ev => { ev.preventDefault(); runMatch(); };
    $("#m-ex").onclick = () => { $("#m-goal").value = EXAMPLE.goal; $("#m-tags").value = EXAMPLE.tags;
      el.querySelectorAll("fieldset input").forEach(c => c.checked = EXAMPLE.methods.some(m => c.value.includes(m))); runMatch(); };
    $("#m-clear").onclick = () => { $("#m-goal").value = ""; $("#m-tags").value = ""; el.querySelectorAll("fieldset input").forEach(c => c.checked = false);
      store.set("match", null); $("#m-out").innerHTML = ""; $("#m-goal").focus(); };
  }
  if (saved.goal || saved.tags) runMatch();
}

function runMatch(){
  const out = $("#m-out");
  const goal = $("#m-goal").value.trim(), tags = $("#m-tags").value.trim();
  const methods = [...document.querySelectorAll("#mf fieldset input:checked")].map(c => c.value);
  store.set("match", {goal, tags, methods: methods.map(m => (m.match(/（(.+)）/) || [])[1] || m)});
  if (!goal && !tags && !methods.length){ out.innerHTML = `<div class="empty">先寫下你想做的研究，或填幾個感興趣的主題，再按「開始比對」。也可以按「填入範例」看看結果長什麼樣子。</div>`; return; }
  MIDX = MIDX || matchDocs();
  const q = [goal, tags.replace(/[、，,;；]/g, " "), ...methods].join(" ");
  const ranked = rankDocs(q, MIDX);
  const papers = ranked.filter(r => r.kind === "paper"), grantsR = ranked.filter(r => r.kind === "grant");
  if (!papers.length && !grantsR.length){ out.innerHTML = `<div class="empty">沒有找到重疊。試試寫得更具體（族群、介入方式、結果變項），或改用英文關鍵詞，例如 chatbot、physical activity、diabetes prevention。</div>`; return; }
  const top = papers.slice(0, 6), max = (top[0] || grantsR[0]).score;
  const W = Object.fromEntries(D.works.map(w => [w.id, w])), G = Object.fromEntries(D.grants.map(g => [g.key, g]));
  const allHit = [...new Set(ranked.slice(0, 10).flatMap(r => r.matched))];
  const show = m => { const d = displayTerms(q, m); return d.length ? d : m; };
  const terms = show(allHit).slice(0, 14);
  const topIds = new Set(top.map(r => r.id));
  const coll = D.coauthors.map(c => ({c, n: c.works.filter(id => topIds.has(id)).length})).filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 6);

  const qs = ((D.profile.find(s => s.key === "questions") || {}).claims || []);

        ${dsel.length ? `<h3>你偏好的研究設計</h3><ul>${dsel.map(x => `<li>${esc(x.m)}：她有 <strong>${x.n}</strong> 篇</li>`).join("")}</ul>` : ""}

const PF = {q: "", ft: "all", year: "all"};
function cardHtml(w){
  const c = w.card;
  const cites = cs => (cs || []).map(x => `<blockquote>"${esc(x.quote)}" <span class="loc">[${esc(w.id)}, ${esc(x.loc)}]</span></blockquote>`).join("");
  const val = f => {
    if (f.state === "pending") return pill("y", "尚未產生");
    if (f.state === "not_in_source") return `<span class="muted">來源未提及</span>`;
    if (f.state === "not_applicable") return `<span class="muted">短卡不適用（會議摘要、社論等）</span>`;
    const head = f.state === "unresolved" ? pill("y", "? 判不出來") + " " : "";
    if (f.key === "limitations"){
      const part = (t, xs, cls) => xs.length ? `<div><strong>${t}</strong> ${cls}<ul>${xs.map(x => `<li>${bi(x.text, x.text_en, "div")}${x.basis ? `<div class="small muted">推論依據：${esc(x.basis)}</div>` : ""}${cites(x.citations)}</li>`).join("")}</ul></div>` : "";
      return head + (part("作者自述", f.author_stated, "") + part("推論", f.inferred, pill("y", "非作者原話")) || `<span class="muted">來源未提及</span>`);
    }
    if (f.claims) return head + (f.claims.length ? `<ol>${f.claims.map(x => `<li>${bi(x.text, x.text_en, "div")}${cites(x.citations)}</li>`).join("")}</ol>` : `<span class="muted">來源未提及</span>`);
    const facts = f.facts && Object.keys(f.facts).length ? `<div class="row small" style="margin-bottom:6px">${Object.entries(f.facts).map(([k, v]) => `<span class="pill o">${esc(k)}：${esc(v)}</span>`).join("")}</div>` : "";
    return head + facts + bi(f.text, f.text_en, "div") + cites(f.citations);
  };
  return `${c.pending_note ? `<p class="small">${pill("y", "注意")} ${esc(c.pending_note)}</p>` : ""}
    <dl class="card">${c.fields.map(f => `<dt>${esc(f.label)}</dt><dd>${val(f)}</dd>`).join("")}</dl>`;
}

    </div></details>`;
}

  el.querySelectorAll("[data-ft]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ft === PF.ft)));
  const hay = w => [w.title, w.venue, w.topic.field, w.topic.subfield, w.topic.name, ...w.authors.map(a => a.name)].join(" ").toLowerCase();
  const list = D.works.filter(w =>
    (!PF.q || hay(w).includes(PF.q)) &&
    (PF.year === "all" || String(w.year) === PF.year) &&
    (PF.ft === "all" || (PF.ft === "ok" && w.fulltext === "ok") || (PF.ft === "abstract" && w.fulltext !== "ok") || (PF.ft === "exc" && w.exceptions.some(e => e.state === "open"))));
  $("#pcount").textContent = `顯示 ${list.length} / ${D.works.length} 篇`;
  $("#plist").innerHTML = list.map(paperHtml).join("") || `<div class="empty">沒有符合的文章。試試清空搜尋字，或把篩選改成「全部」。</div>`;
  $("#plist").querySelectorAll("[data-copy]").forEach(a => a.onclick = ev => {
    ev.preventDefault(); const url = location.href.split("#")[0] + "#paper-" + a.dataset.copy;
    navigator.clipboard?.writeText(url).then(() => { a.textContent = "已複製"; }, () => { location.hash = "paper-" + a.dataset.copy; });
  });
}

let exFilter = "open";
let APP = null;  /* 在應用程式裡打開時是 /api/status 的內容：例外可以按按鈕請 Claude Code 處理 */
const APIX = (path, body, raw) => fetch("/api/" + path, {method: "POST", headers: {"X-Phdeasy-App": "1", "Content-Type": raw ? "application/pdf" : "application/json"},
  body: raw || JSON.stringify(body)}).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; });
const SLUG = new URLSearchParams(location.search).get("p");

function exActions(e){
  if (!APP || e.state !== "open") return "";
  const acts = (APP.exception_actions || {})[e.kind] || [];
  const isPaper = /^W\d+$/.test(e.id);
  const pdfKinds = ["abstract_only", "title_only", "no_source", "no_text", "title_mismatch", "not_main_text", "unreadable", "wrong_file"];
  return `<div class="row">${acts.map(([a, label]) => `<button class="btn ${a === "grant_no" || a === "split_keep" ? "btn-yellow" : "btn-green"}" data-exa="${esc(a)}" data-id="${esc(e.id)}" data-kind="${esc(e.kind)}">${esc(label)}</button>`).join("")}
    ${isPaper && pdfKinds.includes(e.kind) ? `<label class="btn btn-green" style="cursor:pointer">我有 PDF，上傳<input type="file" accept="application/pdf" data-upload="${esc(e.id)}" data-kind="${esc(e.kind)}" hidden></label>` : ""}
    <button class="btn btn-yellow" data-exa="note" data-id="${esc(e.id)}" data-kind="${esc(e.kind)}">其他指示…</button></div>`;
}

async function startException(id, kind, action, note){
  if (APP.running) throw new Error("已經有一個工作在跑，等它跑完再按");
  await APIX("exception", {slug: SLUG, id, kind, action, note: note || ""});
  alert("已請 Claude Code 在背景處理。進度在「建新教授」頁；做完這一頁重新整理就會更新。");
}

function exceptions(){
  const el = body("exceptions");
  const n = s => D.exceptions.filter(e => e.state === s).length;
  const btn = (k, cls, label) => `<button class="btn ${cls}" aria-pressed="${exFilter === k}" data-x="${k}">${label}（${n(k)}）</button>`;
  const list = D.exceptions.filter(e => e.state === exFilter);
  const ops = APP && exFilter === "open";
  el.innerHTML = `<p class="muted">自動段無法完成而被隔離的項目。未解決的例外超過 30% 時流水線會停下來。${ops ? "每一筆可以請 AI 再處理一次，或上傳你自己下載的 PDF。" : (APP ? "" : "在應用程式裡打開這一頁，未解決的例外會有處理按鈕。")}</p>
    <div class="row" role="group" aria-label="例外篩選">${btn("open", "btn-red", "未解決")}${btn("info", "btn-yellow", "註記")}${btn("resolved", "btn-green", "已解決")}</div>
    ${APP && APP.running ? `<div class="card" style="margin-top:8px" role="status">${pill("y", "執行中")} 已經有一個工作在跑：${esc((APP.job || {}).title || "")}。<a href="pipeline.html">看進度</a></div>` : ""}
    <div class="tablebox" style="margin-top:12px"><table><thead><tr><th>狀態</th><th>項目</th><th>階段</th><th>類型</th><th>說明${ops ? "與處理" : ""}</th></tr></thead><tbody>
    ${list.map(e => `<tr><td>${exPill(e)}</td><td>${/^W\d+$/.test(e.id) ? `<a href="#paper-${e.id}">${e.id}</a>` : esc(e.id)}</td><td>${esc(e.stage)}</td><td>${esc(e.kind)}</td><td class="small">${esc(e.detail)}${e.resolved ? `<div class="muted">解決：${esc(e.resolved)}</div>` : ""}${ops ? `<div style="margin-top:8px">${exActions(e)}</div>` : ""}</td></tr>`).join("") || `<tr><td colspan="5">這一類沒有紀錄。</td></tr>`}
    </tbody></table></div>`;
  el.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { exFilter = b.dataset.x; exceptions(); el.querySelector(`[data-x="${exFilter}"]`).focus(); });
  el.querySelectorAll("[data-exa]").forEach(b => b.onclick = async () => {
    let note = "";
    if (b.dataset.exa === "note"){ note = prompt("要 Claude Code 怎麼處理這筆？（例：這篇的正式版在 PubMed Central 有全文，請再找一次）"); if (!note) return; }
    else if (!confirm(`請 Claude Code 處理 ${b.dataset.id}：「${b.textContent}」？`)) return;
    b.disabled = true;
    try { await startException(b.dataset.id, b.dataset.kind, b.dataset.exa, note); APP = await (await fetch("/api/status", {cache: "no-store"})).json(); exceptions(); }
    catch (err) { alert(err.message); b.disabled = false; }
  });
  el.querySelectorAll("[data-upload]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const r = await APIX(`upload/${encodeURIComponent(SLUG)}/${encodeURIComponent(inp.dataset.upload)}`, null, await f.arrayBuffer());
      if (confirm(`已存到 ${r.saved}。要請 Claude Code 用這個檔重做這篇嗎？`)) await startException(inp.dataset.upload, inp.dataset.kind, "retry_fulltext", "本人剛上傳了這篇的 PDF 到 inbox/");
      APP = await (await fetch("/api/status", {cache: "no-store"})).json(); exceptions();
    } catch (err) { alert(err.message); }
  });
}

function rebase(d, base){
  /* data.json 裡的連結是相對於 runs/<slug>/out/site/ 的，轉成這一頁看得懂的網址 */
  const fix = h => h && !/^(https?:|#|mailto:)/.test(h) ? new URL(h, base).href : h;
  d.works.forEach(w => { w.pdf_href = fix(w.pdf_href); });

  return d;
}
async function loadData(){
  const inline = document.getElementById("inline-data").textContent.trim();

  if (!slug) throw new Error("網址少了 ?p=<教授資料夾>");
  const base = new URL(`../runs/${encodeURIComponent(slug)}/out/site/`, location.href);
  const r = await fetch(new URL("data.json", base), {cache: "no-store"});
  if (!r.ok) throw new Error(`讀不到 ${slug} 的資料（${r.status}）`);
  return rebase(await r.json(), base.href);
}
