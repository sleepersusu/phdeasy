name: Build Windows installer

# 推 v* 版號才會跑（只打包 Windows；Mac 用 repo 裡的 開啟教授檔案.command 就好，不打包）
# 產出 PhdeasyProfessorFiles-Setup.exe，發佈到這個 repo 的 Releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Tests (app and sync)
        shell: bash
        run: |
          python -m pip install pytest
          set +e
          python -m pytest -q -p no:warnings tests/test_app.py tests/test_drive_sync.py tests/test_jobs.py tests/test_updater.py > pytest.txt 2>&1
          code=$?
          cat pytest.txt
          # 失敗的測試寫成 annotation：不用登入也看得到哪裡壞了
          grep -E "^(FAILED|ERROR)|^E  " pytest.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - name: Bundle pipeline (scripts, skills, web, CLAUDE.md…) into the app
        shell: bash
        run: |
          mkdir -p pipeline_src
          for p in scripts web tests .claude CLAUDE.md CONTEXT.md README.md pyproject.toml uv.lock .python-version docs; do
            [ -e "$p" ] && cp -R "$p" pipeline_src/
          done
          find pipeline_src -name __pycache__ -prune -exec rm -rf {} +
          printf '%s' "${{ github.ref_name }}" > pipeline_src/VERSION
          ls -la pipeline_src

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --name PhdeasyProfessorFiles
          --paths scripts --add-data "pipeline_src;pipeline_src" scripts/app.py

      - name: Rename exe
        shell: pwsh
        run: Rename-Item "dist/PhdeasyProfessorFiles/PhdeasyProfessorFiles.exe" "教授研究檔案.exe"

      - name: Smoke test (install pipeline into a workspace, serve pages and API)
        shell: pwsh
        run: |
          $ws = Join-Path $env:RUNNER_TEMP "ws"
          $p = Start-Process -FilePath "dist/PhdeasyProfessorFiles/教授研究檔案.exe" -ArgumentList "--workspace","`"$ws`"","--no-browser","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/web/index.html
              $s = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/status
              if ($h.Content -match "pipelinePanel|app.js" -and $s.Content -match '"professors"') { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Output "::error::打包後的程式沒有正常開出首頁或 API"; exit 1 }
          foreach ($f in "CLAUDE.md", ".claude/skills/prof-setup/SKILL.md", "scripts/setup_find_author.py", "web/professor.html") {
            if (-not (Test-Path (Join-Path $ws $f))) { Write-Output "::error::工作區少了 $f"; exit 1 }
          }
          Write-Output "首頁、API、工作區都正常"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          try { Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl" -OutFile "tools/ChineseTraditional.isl" } catch { Write-Output "沒有繁體中文語言檔，用英文" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $env:APP_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & $iscc "tools\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist/PhdeasyProfessorFiles-Setup.exe

      - name: Installer test (silent install and uninstall)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/PhdeasyProfessorFiles-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -PassThru
          if (-not $p.WaitForExit(300000)) { Write-Output "安裝超過 5 分鐘"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\PhdeasyProfessorFiles\教授研究檔案.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error::沒有裝到預期的位置"; exit 1 }
          $u = Start-Process -FilePath (Join-Path $env:LOCALAPPDATA "Programs\PhdeasyProfessorFiles\unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru
          $u.WaitForExit(120000) | Out-Null
          Write-Output "安裝、解除安裝都正常"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhdeasyProfessorFiles-Setup.exe
          body: |
            Windows 下載 PhdeasyProfessorFiles-Setup.exe 安裝。
            第一次打開前，請先安裝 Google Drive 電腦版並登入；教授檔案會從「我的雲端硬碟/phdeasy教授檔案」同步到 使用者\phdeasy\runs。
            要在這台建新教授：先安裝並登入 Claude Code；uv 沒裝的話，程式首頁會問你要不要自動安裝。
